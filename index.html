                  Myne saves everything under <code>~/Myne/</code> on your disk.
                  Preferences are stored in the browser's local storage. Files never leave your machine.
                </p>
              </div>
            </>
          )}
        </div>
        <footer className="settings-foot">
          <div className="settings-foot-hint"
               onContextMenu={onFooterContextMenu}
               title={isElectron ? "Right-click to reveal" : undefined}
               style={isElectron ? { cursor: "context-menu" } : undefined}>
            {isElectron ? "Saved to ~/Myne/" : "Saved to this browser"}
          </div>
          <div className="settings-foot-actions">
            <button className="btn-outline" onClick={handleReturnMaterials}>Return materials</button>
            <button className="btn-outline btn-outline--danger" onClick={handleReset}>Reset</button>
            <button className="btn-outline" onClick={handleRTPV} title="Return to previous version (legacy)">RTPV</button>
          </div>
        </footer>
        {footerMenu && (
          <ContextMenu x={footerMenu.x} y={footerMenu.y}
                       items={[{ label: REVEAL_ROOT_LABEL, icon: "external", onClick: () => onRevealRoot && onRevealRoot() }]}
                       onClose={() => setFooterMenu(null)} />
        )}
      </aside>
    </>
  );
}

function App() {
  const [prefs, setPrefs] = useState(loadPrefs);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [explorerFolderId, setExplorerFolderId] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [modal, setModal] = useState(null);
  const [folderMenu, setFolderMenu] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [folderDragId, setFolderDragId] = useState(null);
  const [folderDrop, setFolderDrop] = useState(null);
  const [folderDropInsideId, setFolderDropInsideId] = useState(null);
  const [clipboard, setClipboard] = useState(null);
  const [trashOpen, setTrashOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [shortcutsOpen, setShortcutsOpen] = useState(false);
  const [progress, setProgress] = useState(null);
  const [dragGhostLabel, setDragGhostLabel] = useState(null);
  const [navHistory, setNavHistory] = useState({ timeline: [], cursor: -1 });
  const [dragFile, setDragFile] = useState(null);
  const [explorerHidden, setExplorerHidden] = useState(false);
  const [fileDropTarget, setFileDropTarget] = useState(null);
  const [selectedFolders, setSelectedFolders] = useState(() => new Set());
  const [activeFolderKey, setActiveFolderKey] = useState(null);
  const folderAnchorRef = useRef(null);
  const folderGridRef = useRef(null);
  const [folderBand, setFolderBand] = useState(null);
  const [folderBandStart, setFolderBandStart] = useState(null);

  const storage = useStorage();
  const {
    isElectron, loading, folders, files, trash, scan, urlFor,
    revealInSystem, openInCursor, readTextFile, moveFile, copyFile,
    restoreFromTrash, emptyTrash, openFolder, openRoot,
    moveFolderInTree, uploadFolderTree,
  } = storage;

  useEffect(() => { savePrefs(prefs); }, [prefs]);
  useEffect(() => { applyPrefsToDom(prefs); }, [prefs]);

  const updatePrefs = useCallback(patch => {
    setPrefs(prev => { const next = { ...prev, ...patch }; savePrefs(next); return next; });
  }, []);
  const resetPrefs = useCallback(() => { setPrefs({ ...DEFAULT_PREFS }); savePrefs({ ...DEFAULT_PREFS }); }, []);
  const returnMaterials = useCallback(() => {
    setPrefs(prev => {
      const next = { ...DEFAULT_PREFS, folderPalettes: { ...(prev.folderPalettes || {}) } };
      savePrefs(next);
      return next;
    });
  }, []);

  const tip = useGlobalTooltips(prefs.showTooltips !== false);

  useEffect(() => {
    const onWheel = (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      setPrefs(prev => {
        const cur = prev.zoomLevel || 1;
        const next = Math.max(0.8, Math.min(1.4, cur + (e.deltaY < 0 ? 0.05 : -0.05)));
        if (Math.abs(next - cur) < 0.001) return prev;
        const merged = { ...prev, zoomLevel: Number(next.toFixed(2)) };
        savePrefs(merged);
        return merged;
      });
    };
    window.addEventListener("wheel", onWheel, { passive: false });
    return () => window.removeEventListener("wheel", onWheel);
  }, []);

  const toggleView = useCallback(() => {
    setPrefs(prev => { const next = { ...prev, view: prev.view === "list" ? "folders" : "list" }; savePrefs(next); return next; });
  }, []);

  const showToast = useCallback((message) => {
    const id = `${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    setToasts(prev => [...prev, { id, message }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), CONFIG.toast.duration);
  }, []);

  useEffect(() => {
    setSelectedFolders(prev => {
      const ids = new Set(folders.map(f => f.id));
      const next = new Set([...prev].filter(id => ids.has(id)));
      if (next.size === prev.size) return prev;
      return next;
    });
    if (activeFolderKey && !folders.find(f => f.id === activeFolderKey)) setActiveFolderKey(null);
  }, [folders, activeFolderKey]);

  const handleCreateFolder = useCallback(async (rawTitle) => {
    const finalTitle = await storage.createFolder(rawTitle, "");
    showToast(`Folder "${finalTitle}" created`);
  }, [storage, showToast]);
  const handleCreateSubfolder = useCallback(async (parentId, parentTitle, rawTitle) => {
    const finalPath = await storage.createFolder(rawTitle, parentId);
    showToast(`Folder "${finalPath}" created`);
  }, [storage, showToast]);
  const handleRenameFolder = useCallback(async (folderId, rawTitle) => {
    const nextId = await storage.renameFolder(folderId, rawTitle);
    setExplorerFolderId(prev => {
      if (prev === folderId) return nextId;
      const prefix = folderId + "/";
      if (prev && prev.startsWith(prefix)) return nextId + prev.slice(folderId.length);
      return prev;
    });
    setNavHistory(prev => ({
      timeline: prev.timeline.map(id => {
        if (id === folderId) return nextId;
        const prefix = folderId + "/";
        if (id.startsWith(prefix)) return nextId + id.slice(folderId.length);
        return id;
      }),
      cursor: prev.cursor,
    }));
    showToast("Folder renamed");
  }, [storage, showToast]);

  const closeExplorer = useCallback(() => {
    setExplorerFolderId(null);
    setNavHistory({ timeline: [], cursor: -1 });
  }, []);

  const handleDeleteFolder = useCallback(async (folderId) => {
    const folder = folders.find(f => f.id === folderId);
    await storage.deleteFolder(folderId);
    if (explorerFolderId === folderId) closeExplorer();
    showToast(folder ? `"${folder.title}" deleted` : "Folder deleted");
  }, [storage, folders, explorerFolderId, closeExplorer, showToast]);

  const handleBulkDeleteFolders = useCallback(async () => {
    const ids = [...selectedFolders];
    if (ids.length === 0) return;
    for (const id of ids) await storage.deleteFolder(id);
    if (explorerFolderId && ids.includes(explorerFolderId)) closeExplorer();
    setSelectedFolders(new Set());
    setActiveFolderKey(null);
    setModal(null);
    showToast(`Deleted ${ids.length} folder${ids.length === 1 ? "" : "s"}`);
  }, [selectedFolders, storage, explorerFolderId, closeExplorer, showToast]);

  const anyOverlay = settingsOpen || !!explorerFolderId || !!lightbox || !!modal || trashOpen || searchOpen || shortcutsOpen;
  useEffect(() => {
    if (!anyOverlay) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, [anyOverlay]);

  useEffect(() => {
    const onKey = e => {
      if (e.key !== "Escape") return;
      if (shortcutsOpen) { setShortcutsOpen(false); return; }
      if (modal) { setModal(null); return; }
      if (trashOpen) { setTrashOpen(false); return; }
      if (folderMenu) { setFolderMenu(null); return; }
      if (lightbox) return;
      if (settingsOpen) { setSettingsOpen(false); return; }
      if (explorerFolderId) { closeExplorer(); return; }
      if (selectedFolders.size > 0 || activeFolderKey) { setSelectedFolders(new Set()); setActiveFolderKey(null); return; }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [modal, trashOpen, folderMenu, lightbox, settingsOpen, explorerFolderId, selectedFolders, activeFolderKey, closeExplorer, shortcutsOpen]);

  useEffect(() => {
    const onKey = (e) => {
      const cmdOrCtrl = e.metaKey || e.ctrlKey;
      if (cmdOrCtrl && e.key.toLowerCase() === "n") { e.preventDefault(); e.stopPropagation(); setModal({ kind: "new" }); return; }
      if (cmdOrCtrl && e.key.toLowerCase() === "q") { e.preventDefault(); e.stopPropagation(); setSearchOpen(o => !o); return; }
      if (cmdOrCtrl && e.key.toLowerCase() === "k") { e.preventDefault(); e.stopPropagation(); toggleView(); return; }
      if (cmdOrCtrl && e.key.toLowerCase() === "r") { e.preventDefault(); scan().then(() => showToast("Refreshed from disk")); return; }
      if (e.key === "F5") { e.preventDefault(); scan().then(() => showToast("Refreshed from disk")); return; }
      if (e.key === "?" && !cmdOrCtrl) { e.preventDefault(); e.stopPropagation(); setShortcutsOpen(true); return; }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [scan, showToast, toggleView]);

  const navigateBack = useCallback(() => {
    setNavHistory(prev => {
      if (prev.cursor <= 0) return prev;
      const nextCursor = prev.cursor - 1;
      setExplorerFolderId(prev.timeline[nextCursor]);
      return { ...prev, cursor: nextCursor };
    });
  }, []);
  const navigateForward = useCallback(() => {
    setNavHistory(prev => {
      if (prev.cursor >= prev.timeline.length - 1) return prev;
      const nextCursor = prev.cursor + 1;
      setExplorerFolderId(prev.timeline[nextCursor]);
      return { ...prev, cursor: nextCursor };
    });
  }, []);
  useEffect(() => {
    if (!explorerFolderId) return;
    const onKey = (e) => {
      if (!e.altKey) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); e.stopPropagation(); navigateBack(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); e.stopPropagation(); navigateForward(); }
    };
    window.addEventListener("keydown", onKey, true);
    return () => window.removeEventListener("keydown", onKey, true);
  }, [explorerFolderId, navigateBack, navigateForward]);

  useEffect(() => {
    const noOverlay = !anyOverlay && folders.length > 0;
    if (!noOverlay) return;
    const ids = folders.map(f => f.id);
    const moveTo = (newKey, extend) => {
      if (extend) {
        if (!folderAnchorRef.current) folderAnchorRef.current = activeFolderKey;
        const anchor = folderAnchorRef.current || activeFolderKey || newKey;
        const a = ids.indexOf(anchor), b = ids.indexOf(newKey);
        setActiveFolderKey(newKey);
        if (a === -1 || b === -1) setSelectedFolders(new Set([newKey]));
        else { const [s, e2] = a < b ? [a, b] : [b, a]; setSelectedFolders(new Set(ids.slice(s, e2 + 1))); }
      } else { folderAnchorRef.current = null; setActiveFolderKey(newKey); setSelectedFolders(new Set([newKey])); }
    };
    const onKey = (e) => {
      const tag = (e.target?.tagName || "").toUpperCase();
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      const meta = e.metaKey || e.ctrlKey;
      if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "Home" || e.key === "End") {
        e.preventDefault(); e.stopPropagation();
        const currentIdx = activeFolderKey ? ids.indexOf(activeFolderKey) : -1;
        let nextIdx;
        if (currentIdx === -1) nextIdx = (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "End") ? ids.length - 1 : 0;
        else if (e.key === "ArrowRight" || e.key === "ArrowDown") nextIdx = Math.min(ids.length - 1, currentIdx + 1);
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") nextIdx = Math.max(0, currentIdx - 1);
        else if (e.key === "Home") nextIdx = 0;
        else nextIdx = ids.length - 1;
        moveTo(ids[nextIdx], e.shiftKey);
        return;
      }
      if (meta && e.key.toLowerCase() === "a") { e.preventDefault(); e.stopPropagation(); setSelectedFolders(new Set(ids)); if (!activeFolderKey) setActiveFolderKey(ids[0]); return; }
      if (e.key === "Delete" || e.key === "Backspace") { if (selectedFolders.size === 0) return; e.preventDefault(); e.stopPropagation(); setModal({ kind: "bulk-delete" }); return; }
      if (e.key === "Enter") { if (!activeFolderKey) return; e.preventDefault(); e.stopPropagation(); openExplorer(activeFolderKey); return; }
      if (e.key === "F2") { if (!activeFolderKey) return; e.preventDefault(); e.stopPropagation(); setModal({ kind: "rename", folderId: activeFolderKey }); return; }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [anyOverlay, folders, activeFolderKey, selectedFolders]);

  const onFolderGridMouseDown = useCallback((e) => {
    if (e.button !== 0) return;
    if (e.target.closest(".folder")) return;
    if (e.target.closest(".empty-popper")) return;
    if (anyOverlay) return;
    setFolderBandStart({ x: e.clientX, y: e.clientY });
    if (!e.metaKey && !e.ctrlKey && !e.shiftKey) { setSelectedFolders(new Set()); setActiveFolderKey(null); }
    folderAnchorRef.current = null;
  }, [anyOverlay]);

  useEffect(() => {
    if (!folderBandStart) return;
    let moved = false;
    const onMove = (ev) => {
      const dx = ev.clientX - folderBandStart.x, dy = ev.clientY - folderBandStart.y;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      moved = true;
      setFolderBand({ x1: Math.min(folderBandStart.x, ev.clientX), y1: Math.min(folderBandStart.y, ev.clientY), x2: Math.max(folderBandStart.x, ev.clientX), y2: Math.max(folderBandStart.y, ev.clientY) });
    };
    const onUp = (ev) => {
      document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp);
      if (moved) {
        const rect = { x1: Math.min(folderBandStart.x, ev.clientX), y1: Math.min(folderBandStart.y, ev.clientY), x2: Math.max(folderBandStart.x, ev.clientX), y2: Math.max(folderBandStart.y, ev.clientY) };
        const grid = folderGridRef.current;
        if (grid) {
          const hits = new Set();
          grid.querySelectorAll("[data-folder-id]").forEach(el => {
            const r = el.getBoundingClientRect();
            if (r.right > rect.x1 && r.left < rect.x2 && r.bottom > rect.y1 && r.top < rect.y2) hits.add(el.dataset.folderId);
          });
          if (ev.shiftKey || ev.metaKey || ev.ctrlKey) setSelectedFolders(prev => new Set([...prev, ...hits]));
          else setSelectedFolders(hits);
          const arr = [...hits]; if (arr.length > 0) setActiveFolderKey(arr[arr.length - 1]);
        }
      }
      setFolderBandStart(null); setFolderBand(null);
    };
    document.addEventListener("mousemove", onMove); document.addEventListener("mouseup", onUp);
    return () => { document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); };
  }, [folderBandStart]);

  const onFolderCardClick = useCallback((e, folder) => {
    if (e.metaKey || e.ctrlKey) {
      setSelectedFolders(prev => { const n = new Set(prev); if (n.has(folder.id)) n.delete(folder.id); else n.add(folder.id); return n; });
      setActiveFolderKey(folder.id); folderAnchorRef.current = null;
    } else if (e.shiftKey && activeFolderKey) {
      const ids = folders.map(f => f.id);
      const anchor = folderAnchorRef.current || activeFolderKey;
      const a = ids.indexOf(anchor), b = ids.indexOf(folder.id);
      if (a !== -1 && b !== -1) { const [s, e2] = a < b ? [a, b] : [b, a]; setSelectedFolders(new Set(ids.slice(s, e2 + 1))); }
      else setSelectedFolders(new Set([folder.id]));
      setActiveFolderKey(folder.id);
    } else { setSelectedFolders(new Set([folder.id])); setActiveFolderKey(folder.id); folderAnchorRef.current = null; }
  }, [folders, activeFolderKey]);

  const onFolderCardDoubleClick = useCallback((folder) => {
    setExplorerFolderId(folder.id);
    setNavHistory({ timeline: [folder.id], cursor: 0 });
  }, []);

  const openLightbox = useCallback(payload => setLightbox({ ...payload, closing: false }), []);
  const closeLightbox = useCallback(() => { setLightbox(prev => prev ? { ...prev, closing: true } : null); setTimeout(() => setLightbox(null), CONFIG.durations.flipClose); }, []);
  const navigateLightbox = useCallback(i => setLightbox(prev => prev ? { ...prev, index: i, sourceRect: null } : null), []);

  const openUpload = useCallback(async (record) => {
    if (record.type.startsWith("image/")) {
      const url = urlFor(record);
      openLightbox({ folderId: record.folderId, projects: [{
        id: record.id, title: record.name, image: url, gradient: kindGradient(record.type),
        desc: `${kindFromMime(record.type, record.name)} · ${formatSize(record.size)}`,
        tech: `Modified ${formatDate(record.lastModified)}`, href: "#",
      }], index: 0, sourceRect: null });
    } else { try { await storage.openFile(record); } catch (e) { showToast("Could not open file"); } }
  }, [urlFor, openLightbox, storage, showToast]);

  const download = useCallback(async (record) => {
    if (isElectron) { try { await storage.openFile(record); } catch (e) { showToast("Could not open file"); } return; }
    const url = urlFor(record); if (!url) return;
    const a = document.createElement("a"); a.href = url; a.download = record.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }, [isElectron, storage, urlFor, showToast]);

  const openExplorer = useCallback((folderId) => {
    const folder = folders.find(f => f.id === folderId);
    if (!folder) return;
    setExplorerFolderId(folderId);
    setNavHistory({ timeline: [folderId], cursor: 0 });
  }, [folders]);

  const navigateExplorer = useCallback((folderId) => {
    const folder = folders.find(f => f.id === folderId);
    if (!folder) return;
    setExplorerFolderId(folderId);
    setNavHistory(prev => {
      if (prev.timeline[prev.cursor] === folderId) return prev;
      const truncated = prev.timeline.slice(0, prev.cursor + 1);
      const next = [...truncated, folderId];
      return { timeline: next, cursor: next.length - 1 };
    });
  }, [folders]);

  const handleCopy = useCallback((record) => setClipboard({ mode: "copy", folder: record.folderId || record.folder, name: record.name, type: record.type }), []);
  const handleCut = useCallback((record) => setClipboard({ mode: "cut", folder: record.folderId || record.folder, name: record.name, type: record.type }), []);
  const clearClipboard = useCallback(() => setClipboard(null), []);
  const executeMove = useCallback(async (record, toFolder) => { const rec = record.folder ? { folderId: record.folder, name: record.name } : record; await moveFile(rec, toFolder); showToast(`Moved to ${toFolder}`); }, [moveFile, showToast]);
  const executeCopy = useCallback(async (record, toFolder) => { const rec = record.folder ? { folderId: record.folder, name: record.name } : record; await copyFile(rec, toFolder); showToast(`Copied to ${toFolder}`); }, [copyFile, showToast]);
  const requestMove = useCallback((record, toFolder, openPicker) => { if (openPicker) return; executeMove(record, toFolder).catch(() => showToast("Move failed")); }, [executeMove, showToast]);
  const requestCopy = useCallback((record, toFolder, openPicker) => { if (openPicker) return; executeCopy(record, toFolder).catch(() => showToast("Copy failed")); }, [executeCopy, showToast]);

  const onFolderContextMenu = useCallback((e, folder) => {
    e.preventDefault(); e.stopPropagation();
    const isMulti = selectedFolders.has(folder.id) && selectedFolders.size > 1;
    if (isMulti) {
      setFolderMenu({ x: e.clientX, y: e.clientY, items: [
        { heading: "Selection" },
        { label: `Delete ${selectedFolders.size} folders`, icon: "trash", danger: true, onClick: () => setModal({ kind: "bulk-delete" }) },
        { separator: true },
        { label: "Deselect all", icon: "x", onClick: () => { setSelectedFolders(new Set()); setActiveFolderKey(null); } },
      ]});
      return;
    }
    if (!selectedFolders.has(folder.id)) { setSelectedFolders(new Set([folder.id])); setActiveFolderKey(folder.id); }
    const items = [
      { heading: "Actions" },
      { label: "Open", icon: "external", shortcut: "↵", onClick: () => openExplorer(folder.id) },
      { label: "New Subfolder…", icon: "plus", onClick: () => setModal({ kind: "new-subfolder", parentId: folder.id, parentTitle: folder.title }) },
    ];
    if (isElectron) items.push({ label: OPEN_FOLDER_LABEL, icon: "folder", onClick: () => openFolder(folder.id).catch(() => showToast("Could not open folder")) });
    items.push(
      { separator: true },
      { label: "Rename…", icon: "pencil", shortcut: "F2", onClick: () => setModal({ kind: "rename", folderId: folder.id }) },
      { separator: true },
      { label: "Delete", icon: "trash", danger: true, shortcut: "⌫", onClick: () => setModal({ kind: "delete", folderId: folder.id }) },
    );
    setFolderMenu({ x: e.clientX, y: e.clientY, items });
  }, [selectedFolders, openExplorer, isElectron, openFolder, showToast]);

  const onFolderDragStart = useCallback((e, folder) => {
    setFolderDragId(folder.id);
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", `folder:${folder.id}`); } catch {}
    if (prefs.showDragGhost !== false) setDragGhostLabel(folder.title);
  }, [prefs.showDragGhost]);
  const onFolderDragOver = useCallback((e, folder) => {
    const types = Array.from(e.dataTransfer?.types || []);
    const hasFiles = types.includes("Files");
    if (folderDragId) {
      if (folderDragId === folder.id) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      const rect = e.currentTarget.getBoundingClientRect();
      const x = e.clientX - rect.left, w = rect.width;
      let zone;
      if (x < w * 0.25) zone = "before";
      else if (x > w * 0.75) zone = "after";
      else zone = "inside";
      if (zone === "inside") { setFolderDrop(null); setFolderDropInsideId(folder.id); }
      else { setFolderDropInsideId(null); setFolderDrop({ id: folder.id, position: zone }); }
      return;
    }
    if (hasFiles || dragFile) {
      e.preventDefault();
      e.dataTransfer.dropEffect = dragFile ? "move" : "copy";
      if (fileDropTarget !== folder.id) setFileDropTarget(folder.id);
    }
  }, [folderDragId, dragFile, fileDropTarget]);
  const onFolderDragLeave = useCallback((e, folder) => {
    const to = e.relatedTarget;
    if (to && e.currentTarget.contains(to)) return;
    if (fileDropTarget === folder.id) setFileDropTarget(null);
    if (folderDrop?.id === folder.id) setFolderDrop(null);
    if (folderDropInsideId === folder.id) setFolderDropInsideId(null);
  }, [fileDropTarget, folderDrop, folderDropInsideId]);

  const onFolderDrop = useCallback(async (e, folder) => {
    e.preventDefault(); e.stopPropagation();
    const fileToMove = dragFile;
    const externalFiles = e.dataTransfer?.files;
    const hasExternal = externalFiles && externalFiles.length > 0;
    const droppingInside = folderDropInsideId === folder.id;
    const reorder = folderDragId && folderDragId !== folder.id && folderDrop && !droppingInside;
    setFileDropTarget(null); setFolderDrop(null); setFolderDropInsideId(null); setDragGhostLabel(null);
    if (folderDragId && folderDragId !== folder.id) {
      if (droppingInside) {
        if (isDescendantOf(folder.id, folderDragId)) showToast("Can't move a folder into itself");
        else { const result = await moveFolderInTree(folderDragId, folder.id, "inside"); if (result) showToast(`Moved into "${folder.title}"`); else showToast("Move failed"); }
        setFolderDragId(null);
        return;
      }
      if (reorder) { storage.reorderFolders(folderDragId, folderDrop.id, folderDrop.position); setFolderDragId(null); return; }
    }
    if (fileToMove) {
      try { await moveFile(fileToMove.record, folder.id); showToast(`Moved to ${folder.title}`); }
      catch (err) { showToast("Move failed"); }
      setDragFile(null); setExplorerHidden(false); setExplorerFolderId(null);
      return;
    }
    if (hasExternal) {
      const items = e.dataTransfer?.items;
      let hasDirectory = false;
      if (items) for (let i = 0; i < items.length; i++) { const entry = items[i].webkitGetAsEntry?.(); if (entry && entry.isDirectory) { hasDirectory = true; break; } }
      if (hasDirectory) {
        const dropped = await collectDroppedTree(e.dataTransfer);
        if (dropped.length) {
          const summary = summarizeTree(dropped);
          setProgress({ label: `Uploading to ${folder.title}`, done: 0, total: summary.dirs + summary.files });
          try {
            await storage.uploadFolderTree(folder.id, dropped, (done, total) => setProgress({ label: `Uploading to ${folder.title}`, done, total }));
            showToast(`Uploaded ${summary.dirs} folder${summary.dirs === 1 ? "" : "s"}, ${summary.files} file${summary.files === 1 ? "" : "s"}`);
          } catch (err) { showToast("Upload failed"); } finally { setProgress(null); }
        }
        return;
      }
      try { await storage.addFiles(folder.id, externalFiles); showToast(`Added ${externalFiles.length} file${externalFiles.length === 1 ? "" : "s"} to ${folder.title}`); }
      catch (err) { showToast("Upload failed"); }
      return;
    }
  }, [dragFile, folderDragId, folderDrop, folderDropInsideId, moveFile, storage, showToast, moveFolderInTree]);

  const onFolderDragEnd = useCallback(() => {
    setFolderDragId(null); setFolderDrop(null); setFolderDropInsideId(null);
    setDragFile(null); setExplorerHidden(false); setFileDropTarget(null); setDragGhostLabel(null);
  }, []);
  const onFileDragBegin = useCallback((record, sourceFolder) => {
    setDragFile({ record, sourceFolder });
    if (prefs.showDragGhost !== false) setDragGhostLabel(record.name);
  }, [prefs.showDragGhost]);
  const onFileDragEnd = useCallback(() => { setDragFile(null); setExplorerHidden(false); setFileDropTarget(null); setDragGhostLabel(null); }, []);
  const onFileDragOutside = useCallback((outside) => { if (outside) setExplorerHidden(true); }, []);

  useEffect(() => {
    const onDragEnd = () => { setFileDropTarget(null); setFolderDrop(null); setFolderDropInsideId(null); setFolderDragId(null); setDragFile(null); setExplorerHidden(false); setDragGhostLabel(null); };
    document.addEventListener("dragend", onDragEnd);
    return () => document.removeEventListener("dragend", onDragEnd);
  }, []);
  useEffect(() => {
    const onDeleteRequest = (e) => { const id = e.detail; if (id) setModal({ kind: "delete", folderId: id }); };
    window.addEventListener("myne:delete-folder-request", onDeleteRequest);
    return () => window.removeEventListener("myne:delete-folder-request", onDeleteRequest);
  }, []);

  const onGridDrop = useCallback(async (e) => {
    const types = Array.from(e.dataTransfer?.types || []);
    if (!types.includes("Files")) return;
    e.preventDefault();
    const items = e.dataTransfer?.items;
    let hasDirectory = false;
    if (items) for (let i = 0; i < items.length; i++) { const entry = items[i].webkitGetAsEntry?.(); if (entry && entry.isDirectory) { hasDirectory = true; break; } }
    if (hasDirectory) {
      const dropped = await collectDroppedTree(e.dataTransfer);
      if (dropped.length) {
        const summary = summarizeTree(dropped);
        setProgress({ label: "Uploading", done: 0, total: summary.dirs + summary.files });
        try {
          await storage.uploadFolderTree("", dropped, (done, total) => setProgress({ label: "Uploading", done, total }));
          showToast(`Uploaded ${summary.dirs} folder${summary.dirs === 1 ? "" : "s"}, ${summary.files} file${summary.files === 1 ? "" : "s"}`);
        } catch (err) { showToast("Upload failed"); } finally { setProgress(null); }
      }
      return;
    }
    const fs = e.dataTransfer?.files;
    if (fs && fs.length) {
      const folderName = prompt("Name for new folder with these files:", "Dropped Files");
      if (!folderName) return;
      const newFolder = await storage.createFolder(folderName, "");
      await storage.addFiles(newFolder, fs);
      showToast(`Created "${newFolder}" with ${fs.length} file${fs.length === 1 ? "" : "s"}`);
    }
  }, [storage, showToast]);

  const customised = useMemo(() => isCustomised(prefs, folders), [prefs, folders]);
  const hiddenCardId = lightbox && !lightbox.closing ? lightbox.projects[lightbox.index]?.id : null;
  const explorerFolder = explorerFolderId ? folders.find(f => f.id === explorerFolderId) : null;
  const modalFolder = modal?.folderId ? folders.find(f => f.id === modal.folderId) : null;
  const bulkFolders = useMemo(() => {
    if (modal?.kind !== "bulk-delete") return [];
    return folders.filter(f => selectedFolders.has(f.id));
  }, [modal, folders, selectedFolders]);
  const topLevelFolders = useMemo(() => folders.filter(f => (f.parent || "") === ""), [folders]);
  const totalItemsCount = useMemo(() => Object.values(files).reduce((s, l) => s + l.length, 0) + folders.reduce((s, f) => s + (f.projects?.length || 0), 0), [files, folders]);
  const totalSizeBytes = useMemo(() => Object.values(files).reduce((s, l) => s + l.reduce((a, x) => a + (x.size || 0), 0), 0), [files]);

  if (loading) {
    return (
      <main className="page">
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "60vh", color: "var(--muted)", fontSize: 13, letterSpacing: ".4px" }}>
          {isElectron ? "Opening ~/Myne/…" : "Loading…"}
        </div>
      </main>
    );
  }

  const isListView = prefs.view === "list";
  const gridAlign = prefs.gridAlign || "center";
  const statusBarHidden = prefs.showStatusBar === false || !!explorerFolderId || !!lightbox || settingsOpen || shortcutsOpen;

  return (
    <>
      <main className="page">
        <header className="topbar">
          {prefs.showBrand !== false ? (
            <div className="brand">
              <span className="brand-main">ALEX CHEN</span>
              <span className="brand-rule" />
              <span className="brand-sub">{isElectron ? "MYNE · LOCAL" : "MYNE"}</span>
            </div>
          ) : <div />}
          <div className="topbar-right">
            {prefs.showNav !== false && (
              <nav className="nav" aria-label="Primary">
                <a href="#">Home</a>
                <a className="active" href="#projects">Projects</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
              </nav>
            )}
            <div className="controls">
              <IconButton icon="plus" label="New folder (Ctrl+N)" onClick={() => setModal({ kind: "new" })} />
              <IconButton icon={prefs.theme === "light" ? "moon" : "sun"}
                          label={prefs.theme === "light" ? "Switch to dark mode" : "Switch to light mode"}
                          onClick={() => updatePrefs({ theme: prefs.theme === "light" ? "dark" : "light" })} />
              <IconButton icon="gear" label="Settings" dot={customised} onClick={() => setSettingsOpen(true)} />
            </div>
          </div>
        </header>

        <section className="hero" id="projects">
          <h1>PROJECTS</h1>
          <p>
            {isElectron
              ? "Everything lives in ~/Myne/ on your disk. Drag folders from your file manager onto any folder to copy the whole tree. Drag folder cards onto each other to nest. Right-click for subfolders. Ctrl+Q to search. Press ? for shortcuts."
              : "A curated collection of my work in product design, development and research."}
          </p>
        </section>

        <div ref={folderGridRef}
             className={folderBand ? "is-band-active" : ""}
             onMouseDown={isListView ? undefined : onFolderGridMouseDown}
             onDragOver={e => { const types = Array.from(e.dataTransfer?.types || []); if (types.includes("Files")) e.preventDefault(); }}
             onDrop={onGridDrop}
             style={isListView ? undefined : { borderRadius: 20, transition: "background .2s ease" }}>
          {isListView ? (
            <FolderListView
              folders={folders} files={files} prefs={prefs}
              onFolderClick={onFolderCardClick}
              onFolderDoubleClick={onFolderCardDoubleClick}
              onContextMenu={onFolderContextMenu}
              selectedFolders={selectedFolders}
              activeFolderKey={activeFolderKey}
              folderDragId={folderDragId}
              folderDrop={folderDrop}
              folderDropInsideId={folderDropInsideId}
              onFolderDragStart={onFolderDragStart}
              onFolderDragOver={onFolderDragOver}
              onFolderDragLeave={onFolderDragLeave}
              onFolderDrop={onFolderDrop}
              onFolderDragEnd={onFolderDragEnd}
            />
          ) : (
            <section key="folders"
                     className={"folders view-enter" + (folderBand ? " is-band-active" : "")}
                     data-align={gridAlign}
                     aria-label="Project folders">
              {topLevelFolders.length === 0 && (
                <div className="explorer-empty" style={{ width: "100%" }}>
                  No folders yet. Click <strong>+</strong> or press <strong>Ctrl+N</strong> to create one.
                  Or drop a folder from your file manager.
                </div>
              )}
              {topLevelFolders.map(folder => {
                const dropClass = folderDrop?.id === folder.id && folderDragId !== folder.id ? ` drop-${folderDrop.position}` : "";
                return (
                  <AnimatedFolder key={folder.id}
                                  folder={folder}
                                  files={files[folder.id] || []}
                                  urlFor={urlFor}
                                  onOpenUpload={openUpload}
                                  paletteKey={prefs.folderPalettes?.[folder.id] || folder.defaultPalette}
                                  hiddenCardId={lightbox && lightbox.folderId === folder.id ? hiddenCardId : null}
                                  onOpenLightbox={openLightbox}
                                  onOpenExplorer={openExplorer}
                                  onContextMenu={onFolderContextMenu}
                                  isDragging={folderDragId === folder.id}
                                  dropClass={dropClass}
                                  isDropInside={folderDropInsideId === folder.id}
                                  isFileDropTarget={fileDropTarget === folder.id}
                                  isSelected={selectedFolders.size > 1 && selectedFolders.has(folder.id)}
                                  isActive={false}
                                  prefs={prefs}
                                  onClick={e => onFolderCardClick(e, folder)}
                                  onDoubleClick={() => onFolderCardDoubleClick(folder)}
                                  onFolderDragStart={onFolderDragStart}
                                  onFolderDragOver={onFolderDragOver}
                                  onFolderDragLeave={onFolderDragLeave}
                                  onFolderDrop={onFolderDrop}
                                  onFolderDragEnd={onFolderDragEnd} />
                );
              })}
            </section>
          )}
        </div>
      </main>

      {explorerFolder && (
        <Explorer
          folder={explorerFolder}
          files={files[explorerFolder.id] || []}
          allFiles={files}
          folders={folders}
          urlFor={urlFor}
          isElectron={isElectron}
          windowStyle={prefs.windowStyle || "default"}
          expanded={!!prefs.explorerExpanded}
          prefs={prefs}
          onToggleExpand={() => updatePrefs({ explorerExpanded: !prefs.explorerExpanded })}
          onClose={closeExplorer}
          onAddFiles={storage.addFiles}
          onRemove={storage.removeFile}
          onRename={storage.renameFile}
          onDownload={download}
          onOpenUpload={openUpload}
          onReorderFiles={storage.reorderFiles}
          onOpenBuiltin={(project, index) => openLightbox({ folderId: explorerFolder.id, projects: explorerFolder.projects, index, sourceRect: null })}
          onMoveTo={requestMove}
          onCopyTo={requestCopy}
          onOpenInCursor={openInCursor}
          onRevealInSystem={revealInSystem}
          readTextFile={readTextFile}
          clipboard={clipboard}
          onCopy={handleCopy}
          onCut={handleCut}
          onClearClipboard={clearClipboard}
          hidden={explorerHidden}
          onFileDragBegin={onFileDragBegin}
          onFileDragEnd={onFileDragEnd}
          onFileDragOutside={onFileDragOutside}
          onNavigateToFolder={navigateExplorer}
          onCreateSubfolder={(parentId, parentTitle) => setModal({ kind: "new-subfolder", parentId, parentTitle })}
          onFolderDragBegin={(f) => { setFolderDragId(f.id); if (prefs.showDragGhost !== false) setDragGhostLabel(f.title); }}
          onFolderDragEnd={onFolderDragEnd}
          onFolderDropInFolder={async (fromId, toId) => {
            if (isDescendantOf(toId, fromId)) { showToast("Can't move a folder into itself"); return; }
            const result = await moveFolderInTree(fromId, toId, "inside");
            if (result) showToast(`Moved into folder`); else showToast("Move failed");
          }}
          onUploadFolderIntoFolder={async (folderId, dropped) => {
            const summary = summarizeTree(dropped);
            setProgress({ label: "Uploading", done: 0, total: summary.dirs + summary.files });
            try {
              await storage.uploadFolderTree(folderId, dropped, (done, total) => setProgress({ label: "Uploading", done, total }));
              showToast(`Uploaded ${summary.dirs} folder${summary.dirs === 1 ? "" : "s"}, ${summary.files} file${summary.files === 1 ? "" : "s"}`);
            } catch (err) { showToast("Upload failed"); } finally { setProgress(null); }
          }}
          canGoBack={navHistory.cursor > 0}
          canGoForward={navHistory.cursor < navHistory.timeline.length - 1}
          onBack={navigateBack}
          onForward={navigateForward}
        />
      )}

      {lightbox && (
        <Lightbox projects={lightbox.projects} index={lightbox.index} sourceRect={lightbox.sourceRect} closing={lightbox.closing}
                  onRequestClose={closeLightbox} onNavigate={navigateLightbox} />
      )}

      {trashOpen && (
        <TrashPanel trash={trash} onClose={() => setTrashOpen(false)}
                    onRestore={async (id) => { await restoreFromTrash(id); showToast("Restored"); }}
                    onEmpty={async () => { await emptyTrash(); showToast("Trash emptied"); setTrashOpen(false); }} />
      )}

      {searchOpen && (
        <GlobalSearch folders={folders} files={files}
                      onClose={() => setSearchOpen(false)}
                      onOpenFolder={(id) => openExplorer(id)}
                      onOpenFile={openUpload} />
      )}

      {shortcutsOpen && <ShortcutsOverlay onClose={() => setShortcutsOpen(false)} />}

      {folderMenu && <ContextMenu x={folderMenu.x} y={folderMenu.y} items={folderMenu.items} onClose={() => setFolderMenu(null)} />}

      {modal?.kind === "new" && <NewFolderModal onCancel={() => setModal(null)} onConfirm={async (title) => { setModal(null); await handleCreateFolder(title); }} />}
      {modal?.kind === "new-subfolder" && (
        <NewFolderModal title="New Subfolder" subtitle={`Inside "${modal.parentTitle}".`}
                        onCancel={() => setModal(null)}
                        onConfirm={async (title) => { const parentId = modal.parentId, parentTitle = modal.parentTitle; setModal(null); await handleCreateSubfolder(parentId, parentTitle, title); }} />
      )}
      {modal?.kind === "rename" && modalFolder && (
        <RenameFolderModal folder={modalFolder} onCancel={() => setModal(null)}
                           onConfirm={async (title) => { setModal(null); await handleRenameFolder(modalFolder.id, title); }} />
      )}
      {modal?.kind === "delete" && modalFolder && (
        <DeleteFolderModal folder={modalFolder} uploadCount={(files[modalFolder.id] || []).length}
                           onCancel={() => setModal(null)}
                           onConfirm={async () => { setModal(null); await handleDeleteFolder(modalFolder.id); }} />
      )}
      {modal?.kind === "bulk-delete" && bulkFolders.length > 0 && (
        <BulkDeleteFoldersModal folders={bulkFolders} files={files} onCancel={() => setModal(null)} onConfirm={handleBulkDeleteFolders} />
      )}

      {!anyOverlay && (
        <button type="button" className={"cmd-fab" + (isListView ? " is-list-mode" : "")}
                onClick={toggleView}
                aria-label={isListView ? "Switch to folder view (Ctrl+K)" : "Switch to list view (Ctrl+K)"}
                title={isListView ? "Switch to folder view (Ctrl+K)" : "Switch to list view (Ctrl+K)"}>⌘</button>
      )}

      {clipboard && !explorerFolderId && (
        <div className="clipboard-pill">
          <span className="clipboard-pill-icon"><Icon name={clipboard.mode === "cut" ? "scissors" : "copy"} size={13} stroke={2.2} /></span>
          <span><strong>{clipboard.mode === "cut" ? "Cut" : "Copied"}</strong> · {clipboard.name}</span>
          <button onClick={clearClipboard}>Clear</button>
        </div>
      )}

      {selectedFolders.size > 1 && !explorerFolderId && !clipboard && (
        <div className="sel-bar">
          <span><strong>{selectedFolders.size}</strong> folders selected</span>
          <button className="is-danger" onClick={() => setModal({ kind: "bulk-delete" })}>Delete</button>
          <button onClick={() => { setSelectedFolders(new Set()); setActiveFolderKey(null); }}>Clear</button>
        </div>
      )}

      {folderBand && ReactDOM.createPortal(
        <div className="drag-rect" style={{ left: folderBand.x1, top: folderBand.y1, width: folderBand.x2 - folderBand.x1, height: folderBand.y2 - folderBand.y1 }} />,
        document.body
      )}

      <ProgressPill progress={progress} />
      <StatusBar folderCount={folders.length} itemCount={totalItemsCount} totalSize={totalSizeBytes} hidden={statusBarHidden} />
      <TooltipPortal tip={tip} />
      <DragGhost label={dragGhostLabel} />

      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)}
                     prefs={prefs} updatePrefs={updatePrefs}
                     resetPrefs={resetPrefs}
                     returnMaterials={returnMaterials}
                     folders={folders}
                     trashCount={trash.length}
                     isElectron={isElectron}
                     onRevealRoot={() => openRoot().catch(() => showToast("Could not open folder"))}
                     onOpenTrash={() => { setSettingsOpen(false); setTrashOpen(true); }} />

      <ToastViewport toasts={toasts} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
