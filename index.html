function Explorer({
  folder, files, expanded, onToggleExpand, windowStyle,
  onClose, onAddFiles, onRemove, onRename, onDownload,
  onOpenUpload, onOpenBuiltin, onReorderFiles, urlFor, isElectron,
  folders, onMoveTo, onCopyTo, onOpenInCursor, onRevealInSystem, readTextFile,
  clipboard, onCopy, onCut, onClearClipboard,
  hidden, onFileDragBegin, onFileDragEnd, onFileDragOutside,
}) {
  const [dragOver, setDragOver] = useState(false);
  const [menu, setMenu] = useState(null);
  const [renaming, setRenaming] = useState(null);
  const [query, setQuery] = useState("");
  const [sort, setSort] = useState(null);
  const [selection, setSelection] = useState(() => new Set());
  const [dragStart, setDragStart] = useState(null);
  const [dragRect, setDragRect] = useState(null);
  const [entering, setEntering] = useState(true);
  const [rowDragId, setRowDragId] = useState(null);
  const [rowDrop, setRowDrop] = useState(null);
  const [activeKey, setActiveKey] = useState(null);
  const [previewOpen, setPreviewOpen] = useState(false);
  const [quickLook, setQuickLook] = useState(false);
  const fileInputRef = useRef();
  const explorerRef = useRef();
  const backdropRef = useRef();
  const bodyRef = useRef();
  const searchRef = useRef();
  const dragCount = useRef(0);
  const minimizingRef = useRef(false);
  const scrollIdleTimerRef = useRef(null);
  const virtualRafRef = useRef(0);
  const rowHeightRef = useRef(30);
  const [virtualRange, setVirtualRange] = useState({ start: 0, end: 40 });
  const visibleItemsRef = useRef([]);

  const macMode = windowStyle === "macos";

  useEffect(() => {
    const t = setTimeout(() => setEntering(false), 420);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    return () => clearTimeout(scrollIdleTimerRef.current);
  }, []);

  const syncVirtualRange = useCallback(() => {
    const body = bodyRef.current;
    if (!body) return;

    const firstRow = body.querySelector(".explorer-row");
    if (firstRow) {
      const measured = firstRow.getBoundingClientRect().height;
      if (measured > 0) rowHeightRef.current = measured;
    }

    const rowHeight = rowHeightRef.current || 30;
    const relativeTop = Math.max(0, body.scrollTop);
    const viewportRows = Math.ceil(Math.max(0, body.clientHeight) / rowHeight);
    const overscan = 20;
    const quantum = 2;
    const itemCount = visibleItemsRef.current.length;
    const rawStart = Math.max(0, Math.floor(relativeTop / rowHeight) - overscan);
    const rawEnd = Math.min(itemCount, Math.ceil(relativeTop / rowHeight) + viewportRows + overscan);
    const start = Math.max(0, Math.floor(rawStart / quantum) * quantum);
    const end = Math.min(itemCount, Math.ceil(rawEnd / quantum) * quantum);

    setVirtualRange(prev => (prev.start === start && prev.end === end) ? prev : { start, end });
  }, []);

  const onBodyScroll = useCallback(() => {
    const body = bodyRef.current;
    if (!body) return;

    body.classList.add("is-scrolling");

    if (!virtualRafRef.current) {
      virtualRafRef.current = requestAnimationFrame(() => {
        virtualRafRef.current = 0;
        syncVirtualRange();
      });
    }

    clearTimeout(scrollIdleTimerRef.current);
    scrollIdleTimerRef.current = setTimeout(() => {
      body.classList.remove("is-scrolling");
      syncVirtualRange();
    }, 100);
  }, [syncVirtualRange]);

  useEffect(() => {
    return () => {
      if (virtualRafRef.current) cancelAnimationFrame(virtualRafRef.current);
    };
  }, []);

  const items = useMemo(() => {
    const builtins = folder.projects.map((p, i) => ({
      kind: "builtin",
      key: p.id,
      data: p,
      index: i,
      _display: {
        name: p.title,
        lastMod: p.date ? formatDate(parseMockDate(p.date)) : "—",
        uploaded: p.date ? formatDate(parseMockDate(p.date)) : "—",
        size: "—",
        kind: "Project",
        iconBg: p.gradient,
        isImage: false,
      },
    }));
    const ups = (files || []).map(u => ({
      kind: "upload",
      key: u.id,
      data: u,
      _display: {
        name: u.name,
        lastMod: formatDate(u.lastModified),
        uploaded: formatDate(u.uploadedAt),
        size: formatSize(u.size),
        kind: kindFromMime(u.type, u.name),
        iconBg: kindGradient(u.type),
        isImage: !!u.type?.startsWith("image/"),
      },
    }));
    return [...builtins, ...ups];
  }, [folder.projects, files]);

  const visibleItems = useMemo(() => {
    const q = query.trim().toLowerCase();
    let list = items;
    if (q) list = items.filter(it => {
      const name = displayName(it).toLowerCase();
      const kind = displayKind(it).toLowerCase();
      return name.includes(q) || kind.includes(q);
    });
    if (!sort) return list;
    const dir = sort.dir === "asc" ? 1 : -1;
    return [...list].sort((a, b) => {
      const av = sortValue(a, sort.key);
      const bv = sortValue(b, sort.key);
      if (typeof av === "string") return av.localeCompare(bv) * dir;
      return (av - bv) * dir;
    });
  }, [items, query, sort]);

  visibleItemsRef.current = visibleItems;

  useEffect(() => {
    const id = requestAnimationFrame(() => syncVirtualRange());
    return () => cancelAnimationFrame(id);
  }, [visibleItems, syncVirtualRange]);

  useEffect(() => {
    const body = bodyRef.current;
    if (!body || typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(() => syncVirtualRange());
    ro.observe(body);
    return () => ro.disconnect();
  }, [syncVirtualRange]);

  const onSort = (key) => {
    setSort(prev => {
      if (!prev || prev.key !== key) return { key, dir: "asc" };
      if (prev.dir === "asc") return { key, dir: "desc" };
      return null;
    });
  };

  useEffect(() => {
    if (!dragStart) return;
    let moved = false;
    const onMove = (ev) => {
      const dx = ev.clientX - dragStart.x;
      const dy = ev.clientY - dragStart.y;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      moved = true;
      setDragRect({
        x1: Math.min(dragStart.x, ev.clientX),
        y1: Math.min(dragStart.y, ev.clientY),
        x2: Math.max(dragStart.x, ev.clientX),
        y2: Math.max(dragStart.y, ev.clientY),
      });
    };
    const onUp = (ev) => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      if (!moved) setSelection(new Set());
      else {
        const rect = {
          x1: Math.min(dragStart.x, ev.clientX),
          y1: Math.min(dragStart.y, ev.clientY),
          x2: Math.max(dragStart.x, ev.clientX),
          y2: Math.max(dragStart.y, ev.clientY),
        };
        const body = bodyRef.current;
        if (body) {
          const hits = new Set();
          body.querySelectorAll(".explorer-row").forEach(el => {
            const r = el.getBoundingClientRect();
            if (r.right > rect.x1 && r.left < rect.x2 && r.bottom > rect.y1 && r.top < rect.y2) {
              const k = el.dataset.key;
              if (k) hits.add(k);
            }
          });
          if (ev.shiftKey || ev.metaKey || ev.ctrlKey) setSelection(prev => new Set([...prev, ...hits]));
          else setSelection(hits);
        }
      }
      setDragStart(null);
      setDragRect(null);
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    return () => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    };
  }, [dragStart]);

  const onBodyMouseDown = (e) => {
    if (e.button !== 0) return;
    const t = e.target;
    if (t.closest(".explorer-row")) return;
    if (t.closest(".explorer-headers")) return;
    if (t.closest(".explorer-rename")) return;
    setDragStart({ x: e.clientX, y: e.clientY });
  };

  const onRowClick = useCallback((e, item) => {
    if (renaming) return;
    setActiveKey(item.key);
    if (e.metaKey || e.ctrlKey) {
      setSelection(prev => {
        const next = new Set(prev);
        if (next.has(item.key)) next.delete(item.key);
        else next.add(item.key);
        return next;
      });
    } else if (e.shiftKey && selection.size > 0) {
      const keys = visibleItems.map(i => i.key);
      const anchorKey = [...selection][selection.size - 1];
      const a = keys.indexOf(anchorKey);
      const b = keys.indexOf(item.key);
      if (a !== -1 && b !== -1) {
        const [s, e2] = a < b ? [a, b] : [b, a];
        setSelection(new Set(keys.slice(s, e2 + 1)));
      } else setSelection(new Set([item.key]));
    } else setSelection(new Set([item.key]));
  }, [renaming, selection, visibleItems]);

  const openAreaMenu = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setMenu({
      x: e.clientX, y: e.clientY,
      items: [
        { label: "Add File…", icon: "plus", onClick: () => fileInputRef.current?.click() },
        { separator: true },
        { label: previewOpen ? "Hide Preview" : "Show Preview",
          icon: previewOpen ? "eyeOff" : "eye",
          shortcut: `${MOD_LABEL}P`,
          onClick: () => setPreviewOpen(p => !p) },
      ],
    });
  };

  const buildRowMenu = (item) => {
    if (item.kind === "builtin") {
      return [
        { label: "Open", icon: "external", shortcut: "↵",
          onClick: () => onOpenBuiltin(item.data, item.index) },
      ];
    }
    const others = folders.filter(f => f.id !== folder.id);
    const moveSubmenu = others.map(f => ({
      label: f.title,
      icon: "folder",
      onClick: () => onMoveTo(item.data, f.id, false),
    }));
    const copySubmenu = others.map(f => ({
      label: f.title,
      icon: "folder",
      onClick: () => onCopyTo(item.data, f.id, false),
    }));
    return [
      { heading: "Open" },
      { label: "Open", icon: "external", shortcut: "↵", onClick: () => onOpenUpload(item.data) },
      { label: "Quick Look", icon: "eye", shortcut: "␣",
        onClick: () => { setActiveKey(item.key); setQuickLook(true); } },
      { separator: true },
      { heading: "Edit" },
      { label: "Cut", icon: "scissors", shortcut: `${MOD_LABEL}X`,
        onClick: () => { setActiveKey(item.key); onCut(item.data); } },
      { label: "Copy", icon: "copy", shortcut: `${MOD_LABEL}C`,
        onClick: () => { setActiveKey(item.key); onCopy(item.data); } },
      { label: "Rename…", icon: "pencil", shortcut: "F2",
        onClick: () => setRenaming({ id: item.data.id, value: item.data.name }) },
      { separator: true },
      { label: "Move to", icon: "arrow",
        submenu: moveSubmenu.length ? moveSubmenu : [{ label: "No other folders", disabled: true }] },
      { label: "Copy to", icon: "copy",
        submenu: copySubmenu.length ? copySubmenu : [{ label: "No other folders", disabled: true }] },
      { separator: true },
      { heading: "Tools" },
      { label: "Open in Cursor", icon: "code", shortcut: `${MOD_LABEL}O`,
        onClick: () => onOpenInCursor(item.data).catch(() => {}) },
      { label: "Download", icon: "download", onClick: () => onDownload(item.data) },
      { label: "Reveal in system", icon: "external", onClick: () => onRevealInSystem(item.data) },
      { separator: true },
      { heading: "Danger" },
      { label: "Delete", icon: "trash", danger: true, shortcut: "⌫",
        onClick: () => onRemove(item.data) },
    ];
  };

  const openRowMenu = useCallback((e, item) => {
    e.preventDefault();
    e.stopPropagation();
    const isMultiSelected = selection.has(item.key) && selection.size > 1;
    if (isMultiSelected) {
      setMenu({
        x: e.clientX, y: e.clientY,
        items: [
          { heading: "Selection" },
          { label: `Delete ${selection.size} items`, icon: "trash", danger: true,
            onClick: () => bulkDelete() },
        ],
      });
      return;
    }
    setMenu({ x: e.clientX, y: e.clientY, items: buildRowMenu(item) });
  }, [selection, folders, folder.id]);

  const bulkDelete = () => {
    for (const key of selection) {
      const it = items.find(i => i.key === key);
      if (it && it.kind === "upload") onRemove(it.data);
    }
    setSelection(new Set());
    setActiveKey(null);
  };
  const bulkDownload = () => {
    let i = 0;
    for (const key of selection) {
      const it = items.find(x => x.key === key);
      if (it && it.kind === "upload") {
        setTimeout(() => onDownload(it.data), i * 120);
        i++;
      }
    }
  };

  const getActiveRecord = useCallback(() => {
    const item = items.find(it => it.key === activeKey);
    if (!item || item.kind !== "upload") return null;
    return item.data;
  }, [items, activeKey]);

  const handlePaste = useCallback(async () => {
    if (!clipboard) return;
    if (clipboard.folder === folder.id && clipboard.mode === "cut") return;
    try {
      if (clipboard.mode === "cut") {
        await onMoveTo(clipboard, folder.id);
      } else {
        await onCopyTo(clipboard, folder.id);
      }
      onClearClipboard();
    } catch (e) { console.error(e); }
  }, [clipboard, folder.id, onMoveTo, onCopyTo, onClearClipboard]);

  const isExternalDrag = (e) => {
    const types = e.dataTransfer?.types;
    if (!types) return false;
    return Array.from(types).includes("Files");
  };
  const onDragEnter = (e) => {
    if (!isExternalDrag(e)) return;
    e.preventDefault();
    dragCount.current++;
    setDragOver(true);
  };
  const onDragOver = (e) => {
    if (!isExternalDrag(e)) return;
    e.preventDefault();
  };
  const onDragLeave = (e) => {
    if (!isExternalDrag(e)) return;
    dragCount.current = Math.max(0, dragCount.current - 1);
    if (dragCount.current === 0) setDragOver(false);
  };
  const onDrop = (e) => {
    if (!isExternalDrag(e)) return;
    e.preventDefault();
    dragCount.current = 0;
    setDragOver(false);
    const fs = e.dataTransfer?.files;
    if (fs && fs.length) onAddFiles(folder.id, fs);
  };

  const onPick = (e) => {
    const fs = e.target.files;
    if (fs && fs.length) onAddFiles(folder.id, fs);
    e.target.value = "";
  };

  const commitRename = useCallback((item, value) => {
    if (!renaming) return;
    onRename(item.data, value);
    setRenaming(null);
  }, [renaming, onRename]);

  const handleMinimize = useCallback(() => {
    if (minimizingRef.current) return;
    minimizingRef.current = true;

    const win = explorerRef.current;
    const backdrop = backdropRef.current;
    if (!win) { onClose(); return; }

    const DURATION = CONFIG.durations.minimize;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const baseT = expanded ? "" : "translate(-50%, -50%) ";

    let card = null;
    const cards = document.querySelectorAll(".folder[data-folder-id]");
    for (const el of cards) {
      if (el.dataset.folderId === folder.id) { card = el; break; }
    }

    let cardInView = false;
    let cardRect = null;
    if (card) {
      cardRect = card.getBoundingClientRect();
      cardInView = cardRect.right > 0 && cardRect.left < vw &&
                   cardRect.bottom > 0 && cardRect.top < vh;
    }

    win.style.pointerEvents = "none";
    if (backdrop) backdrop.style.pointerEvents = "none";

    if (cardInView && cardRect) {
      const winRect = win.getBoundingClientRect();
      const winCx = winRect.left + winRect.width / 2;
      const winCy = winRect.top + winRect.height / 2;
      const cardCx = cardRect.left + cardRect.width / 2;
      const cardCy = cardRect.top + cardRect.height / 2;
      const dx = cardCx - winCx;
      const dy = cardCy - winCy;
      const s = Math.min(cardRect.width / winRect.width, cardRect.height / winRect.height);

      win.animate([
        { transform: `${baseT}translate(0px, 0px) scale(1)`, opacity: 1, offset: 0 },
        { transform: `${baseT}translate(${dx}px, ${dy}px) scale(${s})`, opacity: 0.35, offset: 0.85 },
        { transform: `${baseT}translate(${dx}px, ${dy}px) scale(${s})`, opacity: 0, offset: 1 },
      ], { duration: DURATION, easing: "cubic-bezier(.4, 0, .2, 1)", fill: "forwards" });
    } else {
      const winRect = win.getBoundingClientRect();
      const s = 0.15;
      const smallW = winRect.width * s;
      const topDy = 80 - vh / 2;
      const padL = 32;
      const leftDx = padL + smallW / 2 - vw / 2;
      const bounceDx = 48;

      win.animate([
        { transform: `${baseT}translate(0px, 0px) scale(1)`, opacity: 1, offset: 0 },
        { transform: `${baseT}translate(0px, ${topDy}px) scale(${s})`, opacity: 1, offset: 0.22 },
        { transform: `${baseT}translate(${leftDx}px, 0px) scale(${s})`, opacity: 1, offset: 0.55 },
        { transform: `${baseT}translate(${leftDx + bounceDx}px, 0px) scale(${s})`, opacity: 1, offset: 0.68 },
        { transform: `${baseT}translate(${leftDx}px, 0px) scale(${s})`, opacity: 1, offset: 0.80 },
        { transform: `${baseT}translate(${leftDx}px, 0px) scale(${s})`, opacity: 0, offset: 1 },
      ], { duration: DURATION, easing: "ease-in-out", fill: "forwards" });
    }

    if (backdrop) {
      backdrop.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        { duration: DURATION, easing: "ease-out", fill: "forwards" }
      );
    }

    setTimeout(() => onClose(), DURATION);
  }, [folder.id, onClose, expanded]);

  const onRowDragStart = useCallback((e, item) => {
    if (renaming) { e.preventDefault(); return; }
    if (item.kind !== "upload") { e.preventDefault(); return; }
    setRowDragId(item.key);
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", item.key); } catch {}
    onFileDragBegin(item.data, folder.id);
  }, [renaming, onFileDragBegin, folder.id]);

  const onRowDrag = useCallback((e) => {
    if (!rowDragId) return;
    if (e.clientX === 0 && e.clientY === 0) return;
    const el = explorerRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const outside = e.clientX < r.left || e.clientX > r.right ||
                    e.clientY < r.top  || e.clientY > r.bottom;
    onFileDragOutside(outside);
  }, [rowDragId, onFileDragOutside]);

  const onRowDragOver = useCallback((e, item) => {
    if (!rowDragId || rowDragId === item.key) return;
    if (item.kind !== "upload") {
      e.dataTransfer.dropEffect = "none";
      if (rowDrop) setRowDrop(null);
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect = "move";
    const rect = e.currentTarget.getBoundingClientRect();
    const pos = (e.clientY - rect.top) < rect.height / 2 ? "before" : "after";
    setRowDrop({ id: item.key, position: pos });
  }, [rowDragId, rowDrop]);

  const onRowDragLeave = useCallback((e, item) => {
    const to = e.relatedTarget;
    if (to && e.currentTarget.contains(to)) return;
    if (rowDrop?.id === item.key) setRowDrop(null);
  }, [rowDrop]);

  const onRowDrop = useCallback((e, item) => {
    if (item.kind !== "upload") return;
    e.preventDefault();
    e.stopPropagation();
    if (!rowDragId || rowDragId === item.key || !rowDrop) {
      setRowDragId(null); setRowDrop(null); return;
    }
    onReorderFiles(folder.id, rowDragId, rowDrop.id, rowDrop.position);
    setRowDragId(null); setRowDrop(null);
  }, [rowDragId, rowDrop, onReorderFiles, folder.id]);

  const onRowDragEnd = useCallback(() => {
    setRowDragId(null); setRowDrop(null);
    onFileDragEnd();
  }, [onFileDragEnd]);

  const onRowDoubleClick = useCallback((item) => {
    if (item.kind === "builtin") onOpenBuiltin(item.data, item.index);
    else onOpenUpload(item.data);
  }, [onOpenBuiltin, onOpenUpload]);

  const onRenameChange = useCallback((key, val) => {
    setRenaming({ id: key, value: val });
  }, []);
  const onRenameCancel = useCallback(() => setRenaming(null), []);

  useEffect(() => {
    const keys = visibleItems.map(it => it.key);

    const moveTo = (key) => {
      setActiveKey(key);
      setSelection(new Set([key]));
      requestAnimationFrame(() => {
        const body = bodyRef.current;
        if (!body) return;
        const idx = keys.indexOf(key);
        if (idx < 0) return;
        const rowHeight = rowHeightRef.current || 30;
        const top = idx * rowHeight;
        const bottom = top + rowHeight;
        const viewTop = body.scrollTop;
        const viewBottom = body.scrollTop + body.clientHeight;
        if (top < viewTop) {
          body.scrollTo({ top, behavior: "smooth" });
        } else if (bottom > viewBottom) {
          body.scrollTo({ top: Math.max(0, bottom - body.clientHeight), behavior: "smooth" });
        }
      });
    };

    const onKey = (e) => {
      const tag = (e.target?.tagName || "").toUpperCase();
      const inText = tag === "INPUT" || tag === "TEXTAREA";

      if (e.key === "Escape" && inText) {
        e.target.blur();
        e.stopPropagation();
        return;
      }
      if (inText) return;

      const meta = e.metaKey || e.ctrlKey;
      const currentIdx = activeKey ? keys.indexOf(activeKey) : -1;

      if (e.key === "ArrowDown" || e.key === "ArrowUp" ||
          e.key === "Home" || e.key === "End") {
        if (keys.length === 0) return;
        e.preventDefault();
        e.stopPropagation();
        let nextIdx;
        if (currentIdx === -1) {
          nextIdx = e.key === "ArrowUp" ? keys.length - 1 : 0;
        } else if (e.key === "ArrowDown") {
          nextIdx = Math.min(keys.length - 1, currentIdx + 1);
        } else if (e.key === "ArrowUp") {
          nextIdx = Math.max(0, currentIdx - 1);
        } else if (e.key === "Home") {
          nextIdx = 0;
        } else {
          nextIdx = keys.length - 1;
        }
        moveTo(keys[nextIdx]);
        return;
      }

      if (e.key === " " && !e.metaKey && !e.ctrlKey) {
        const item = items.find(it => it.key === activeKey);
        if (!item || item.kind !== "upload") return;
        e.preventDefault();
        e.stopPropagation();
        setQuickLook(true);
        return;
      }

      if (meta && e.key.toLowerCase() === "p") {
        e.preventDefault();
        e.stopPropagation();
        setPreviewOpen(p => !p);
        return;
      }

      if (meta && e.key.toLowerCase() === "c") {
        const rec = getActiveRecord();
        if (!rec) return;
        e.preventDefault();
        e.stopPropagation();
        onCopy(rec);
        return;
      }
      if (meta && e.key.toLowerCase() === "x") {
        const rec = getActiveRecord();
        if (!rec) return;
        e.preventDefault();
        e.stopPropagation();
        onCut(rec);
        return;
      }
      if (meta && e.key.toLowerCase() === "v") {
        if (!clipboard) return;
        e.preventDefault();
        e.stopPropagation();
        handlePaste();
        return;
      }

      if (meta && e.key.toLowerCase() === "o") {
        const rec = getActiveRecord();
        if (!rec) return;
        e.preventDefault();
        e.stopPropagation();
        onOpenInCursor(rec).catch(() => {});
        return;
      }

      if (e.key === "Enter") {
        const item = items.find(it => it.key === activeKey);
        if (!item) return;
        e.preventDefault();
        e.stopPropagation();
        if (item.kind === "builtin") onOpenBuiltin(item.data, item.index);
        else onOpenUpload(item.data);
        return;
      }

      if (e.key === "F2") {
        const item = items.find(it => it.key === activeKey);
        if (!item || item.kind !== "upload") return;
        e.preventDefault();
        e.stopPropagation();
        setRenaming({ id: item.data.id, value: item.data.name });
        return;
      }

      if (e.key === "Delete" || e.key === "Backspace") {
        if (selection.size === 0) return;
        e.preventDefault();
        e.stopPropagation();
        bulkDelete();
        return;
      }

      if (meta && e.key.toLowerCase() === "a") {
        e.preventDefault();
        e.stopPropagation();
        setSelection(new Set(visibleItems.map(it => it.key)));
        return;
      }

      if (meta && e.key.toLowerCase() === "f") {
        e.preventDefault();
        e.stopPropagation();
        searchRef.current?.focus();
        searchRef.current?.select?.();
        return;
      }

      if (e.key === "Escape") {
        if (quickLook) {
          e.preventDefault();
          e.stopPropagation();
          setQuickLook(false);
          return;
        }
        if (selection.size > 0 || activeKey) {
          e.preventDefault();
          e.stopPropagation();
          setSelection(new Set());
          setActiveKey(null);
        }
      }
    };

    window.addEventListener("keydown", onKey, true);
    return () => window.removeEventListener("keydown", onKey, true);
  }, [visibleItems, items, activeKey, selection, onOpenBuiltin, onOpenUpload,
      clipboard, onCopy, onCut, getActiveRecord, handlePaste, onOpenInCursor, quickLook]);

  useEffect(() => {
    if (activeKey && !items.find(it => it.key === activeKey)) {
      setActiveKey(null);
    }
  }, [items, activeKey]);

  const cls = "explorer"
    + (expanded ? " is-expanded" : "")
    + (entering ? " is-entering" : "")
    + (hidden ? " is-hidden-for-drag" : "");
  return (
    <>
      <div ref={backdropRef}
           className={"explorer-backdrop" + (hidden ? " is-hidden-for-drag" : "")}
           onClick={onClose} />
      <div ref={explorerRef}
           className={cls}
           role="dialog" aria-modal="true" aria-label={folder.title}
           onDragEnter={onDragEnter}
           onDragOver={onDragOver}
           onDragLeave={onDragLeave}
           onDrop={onDrop}>
        <header className="explorer-toolbar">
          {macMode && (
            <TrafficLights
              onClose={onClose}
              onMinimize={handleMinimize}
              onToggleExpand={onToggleExpand}
              expanded={expanded}
            />
          )}
          {selection.size > 0 ? (
            <>
              <span className="explorer-sel-count">{selection.size} selected</span>
              <button className="explorer-nav-btn explorer-nav-btn--accent"
                      aria-label="Download selected" title="Download selected"
                      onClick={bulkDownload}>
                <Icon name="download" size={16} stroke={2.4} />
              </button>
              <button className="explorer-nav-btn explorer-nav-btn--danger"
                      aria-label="Delete selected" title="Delete selected"
                      onClick={bulkDelete}>
                <Icon name="trash" size={16} stroke={2.4} />
              </button>
              <button className="explorer-nav-btn"
                      aria-label="Clear selection" title="Clear selection"
                      onClick={() => { setSelection(new Set()); setActiveKey(null); }}>
                <Icon name="x" size={16} stroke={2.4} />
              </button>
            </>
          ) : (
            <>
              <button className="explorer-nav-btn explorer-nav-btn--back" disabled aria-label="Back">
                <Icon name="left" size={16} stroke={2.4} />
              </button>
              <button className="explorer-nav-btn explorer-nav-btn--fwd" disabled aria-label="Forward">
                <Icon name="right" size={16} stroke={2.4} />
              </button>
              <h2 className="explorer-title">
                {folder.title}
                <small>
                  {items.length} {items.length === 1 ? "item" : "items"}
                  {files?.length ? ` · ${files.length} file${files.length === 1 ? "" : "s"}` : ""}
                </small>
              </h2>
              <div className="explorer-search">
                <input ref={searchRef} className="explorer-search-input" type="search" placeholder="Search"
                       value={query} onChange={e => setQuery(e.target.value)} />
              </div>
              <button className={"explorer-nav-btn" + (previewOpen ? " explorer-nav-btn--accent" : "")}
                      aria-label={previewOpen ? "Hide preview" : "Show preview"}
                      title="Toggle preview (Ctrl+P)"
                      onClick={() => setPreviewOpen(p => !p)}>
                <Icon name={previewOpen ? "eyeOff" : "eye"} size={15} stroke={2.2} />
              </button>
              <button className="explorer-nav-btn explorer-nav-btn--accent"
                      aria-label="Add file" title="Add file"
                      onClick={() => fileInputRef.current?.click()}>
                <Icon name="plus" size={16} stroke={2.4} />
              </button>
              {!macMode && (

            </div>

          )}
          {visibleItems.length > 0 && (() => {
            const start = Math.max(0, Math.min(virtualRange.start, visibleItems.length));
            const end = Math.max(start, Math.min(virtualRange.end, visibleItems.length));
            const rowHeight = rowHeightRef.current || 30;
            const topSpace = start * rowHeight;
            const bottomSpace = Math.max(0, visibleItems.length - end) * rowHeight;
            return (
              <>
                {topSpace > 0 && <div aria-hidden="true" style={{ height: topSpace }} />}
                {visibleItems.slice(start, end).map(item => {
            const isRenaming = !!(renaming && renaming.id === item.key);
            const dropClass = rowDrop?.id === item.key && rowDragId !== item.key
              ? ` drop-${rowDrop.position}` : "";
            return (
              <ExplorerRow
                key={item.key}
                item={item}
                isSelected={selection.has(item.key)}
                isRenaming={isRenaming}
                isActive={activeKey === item.key}
                isDragging={rowDragId === item.key}

                onRowDrag={onRowDrag}
                onRowDragOver={onRowDragOver}
                onRowDragLeave={onRowDragLeave}
                onRowDrop={onRowDrop}
                onRowDragEnd={onRowDragEnd}
                onRenameChange={onRenameChange}

                onRenameCancel={onRenameCancel}

                {bottomSpace > 0 && <div aria-hidden="true" style={{ height: bottomSpace }} />}
              </>
            );
          })()}
          </div>
        </div>
        {previewOpen && (
          <aside className="explorer-preview">

        <div className="drag-rect" style={{

          width: dragRect.x2 - dragRect.x1, height: dragRect.y2 - dragRect.y1,
        }} />,

      )}
    </>
  );
}

function AnimatedFolder({
  folder, files, urlFor, onOpenUpload,
  paletteKey, hiddenCardId,
  onOpenLightbox, onOpenExplorer, onContextMenu,
  isDragging, dropClass, isFileDropTarget, isSelected, isActive,
  onFolderDragStart, onFolderDragOver, onFolderDragLeave, onFolderDrop, onFolderDragEnd,
  onClick, onDoubleClick,
}) {
  const [isHovered, setIsHovered] = useState(false);
  const cardRefs = useRef([]);

  const builtinCount = folder.projects.length;
  const uploadCount = (files || []).length;
  const totalCount = builtinCount + uploadCount;
  const isEmpty = totalCount === 0;

  const projects = useMemo(() => {
    if (builtinCount > 0) return folder.projects.slice(0, 3);
    return (files || []).slice(0, 3).map(f => ({
      id: f.id,
      title: f.name,
      image: f.type?.startsWith("image/") ? urlFor(f) : null,
      gradient: kindGradient(f.type),
      _isUpload: true,
      _upload: f,
    }));
  }, [folder.projects, files, builtinCount, urlFor]);

  const count = projects.length;
  const mid = (count - 1) / 2;
  const { spacingX, rotation } = CONFIG.fan[count] || CONFIG.fan[3];
  const preset = PRESETS[paletteKey] || PRESETS.parchment;
  const folderVars = {
    "--folder-back": preset.back,
    "--folder-front": preset.front,
    "--folder-tab": preset.front,
    "--folder-glow": preset.glow,
  };
  const handleCardClick = i => {
    const p = projects[i];
    if (!p) return;
    if (p._isUpload) {
      onOpenUpload(p._upload);
      return;
    }
    const el = cardRefs.current[i];
    onOpenLightbox({
      folderId: folder.id, projects, index: i,
      sourceRect: el ? el.getBoundingClientRect() : null,
    });
  };
  return (
    <div className={"folder"
                    + (isDragging ? " is-dragging" : "")
                    + (dropClass || "")
                    + (isFileDropTarget ? " is-file-drop" : "")
                    + (isSelected ? " is-selected" : "")
                    + (isActive ? " is-active" : "")}
         style={folderVars}
         draggable
         data-folder-id={folder.id}
         onMouseEnter={() => setIsHovered(true)}
         onMouseLeave={() => setIsHovered(false)}
         onTouchStart={() => setIsHovered(true)}
         onClick={onClick}
         onDoubleClick={onDoubleClick}
         onContextMenu={e => onContextMenu(e, folder)}
         onDragStart={e => onFolderDragStart(e, folder)}
         onDragOver={e => onFolderDragOver(e, folder)}
         onDragLeave={e => onFolderDragLeave(e, folder)}
         onDrop={e => onFolderDrop(e, folder)}
         onDragEnd={onFolderDragEnd}>
      <div className="folder-glow" />
      <div className="folder-stage">
        <div className="folder-stack">
          <FolderStack isHovered={isHovered} />
          {isEmpty ? (
            <div className="folder-cards">
              <div className="empty-popper" data-visible={isHovered}>Empty</div>
            </div>
          ) : (
            <div className="folder-cards">
              {projects.map((p, i) => (
                <ProjectCard key={p.id}
                             innerRef={el => { cardRefs.current[i] = el; }}
                             project={p}
                             offsetX={(i - mid) * spacingX}
                             rotation={(i - mid) * rotation}
                             zIndex={10 - Math.round(Math.abs(i - mid))}
                             delay={i * CONFIG.card.delay}
                             visible={isHovered}
                             hidden={hiddenCardId === p.id}
                             onClick={() => handleCardClick(i)} />
              ))}
            </div>
          )}
        </div>
      </div>
      <h3 className="folder-title">{folder.title}</h3>
      <p className="folder-count">
        {isEmpty
          ? "Empty"
          : `${totalCount} ${totalCount === 1 ? "item" : "items"}`}
      </p>
      <div className="folder-hint"
           style={{ opacity: isHovered ? 0 : 0.7,
                    transform: isHovered ? "translate(-50%, 8px)" : "translate(-50%, 0)" }}>
        Double-click to open
      </div>
    </div>
  );
}

function FolderListView({
  folders, files, prefs,
  onFolderClick, onFolderDoubleClick, onContextMenu,
  selectedFolders, activeFolderKey,
  folderDragId, folderDrop,
  onFolderDragStart, onFolderDragOver, onFolderDragLeave, onFolderDrop, onFolderDragEnd,
}) {
  const rows = useMemo(() => folders.map(f => {
    const fs = files[f.id] || [];
    const totalSize = fs.reduce((s, x) => s + (x.size || 0), 0);
    const lastMod = fs.length ? Math.max(...fs.map(x => x.lastModified || 0)) : 0;
    const totalItems = fs.length + (f.projects?.length || 0);
    return {
      folder: f,
      id: f.id,
      title: f.title,
      totalItems,
      size: totalSize,
      lastMod,
      palette: prefs.folderPalettes?.[f.id] || f.defaultPalette,

    <section className="folder-list view-enter" aria-label="Folder list">

        <div className="folder-list-header">Contents</div>
      </div>
      {rows.length === 0 && (

        const preset = PRESETS[row.palette] || PRESETS.parchment;
        const isSelected = selectedFolders.size > 1 && selectedFolders.has(row.id);
        const isFocused = activeFolderKey === row.id;

        const dropClass = folderDrop?.id === row.id && folderDragId !== row.id
          ? ` drop-${folderDrop.position}` : "";
        return (
          <div key={row.id}
               data-folder-id={row.id}
               draggable
               className={"folder-list-row"
                          + (isSelected ? " is-selected" : "")
                          + (isFocused ? " is-focused" : "")
                          + (isDragging ? " is-dragging" : "")

               onClick={e => onFolderClick(e, row.folder)}
               onDoubleClick={() => onFolderDoubleClick(row.folder)}
               onContextMenu={e => onContextMenu(e, row.folder)}
               onDragStart={e => onFolderDragStart(e, row.folder)}
               onDragOver={e => onFolderDragOver(e, row.folder)}
               onDragLeave={e => onFolderDragLeave(e, row.folder)}
               onDrop={e => onFolderDrop(e, row.folder)}
               onDragEnd={onFolderDragEnd}
               title="Double-click to open · Right-click for options">
            <div className="folder-list-name">
              <span className="folder-list-swatch"
                    style={{ background: `linear-gradient(135deg, ${preset.front}, ${preset.back})` }}
                    aria-hidden="true" />
              <span>{row.title}</span>
            </div>
            <div className="folder-list-meta folder-list-col-modified">
              {row.lastMod ? formatDate(row.lastMod) : "—"}
            </div>
            <div className="folder-list-meta folder-list-col-size">
              {row.size ? formatSize(row.size) : "—"}
            </div>
            <div className="folder-list-meta">
              {row.totalItems === 0
                ? "Empty"
                : `${row.totalItems} item${row.totalItems === 1 ? "" : "s"}`}
            </div>
          </div>
        );
      })}
    </section>
  );
}
function GlobalSearch({ folders, files, onClose, onOpenFolder, onOpenFile }) {
  const [query, setQuery] = useState("");
  const [activeIdx, setActiveIdx] = useState(0);
  const inputRef = useRef();
  const listRef = useRef();

  useEffect(() => {
    requestAnimationFrame(() => inputRef.current?.focus());
  }, []);

  const results = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    const hits = [];
    for (const f of folders) {
      if (f.title.toLowerCase().includes(q)) {
        const count = (files[f.id] || []).length + (f.projects || []).length;
        hits.push({
          kind: "folder",
          id: `folder::${f.id}`,
          title: f.title,
          subtitle: `${count} item${count === 1 ? "" : "s"}`,
          data: f,
        });
      }
    }
    for (const f of folders) {
      const list = files[f.id] || [];
      for (const file of list) {
        if (file.name.toLowerCase().includes(q)) {
          hits.push({
            kind: "file",
            id: `file::${file.id}`,
            title: file.name,
            subtitle: `${f.title} · ${formatSize(file.size)}`,
            data: file,
          });
        }
      }
    }
    return hits.slice(0, 60);
  }, [query, folders, files]);

  useEffect(() => { setActiveIdx(0); }, [query]);

  useEffect(() => {
    const el = listRef.current?.querySelector(`[data-idx="${activeIdx}"]`);
    el?.scrollIntoView({ block: "nearest" });
  }, [activeIdx]);

  const commit = useCallback((r) => {
    onClose();
    if (!r) return;
    if (r.kind === "folder") onOpenFolder(r.data.id);
    else onOpenFile(r.data);
  }, [onClose, onOpenFolder, onOpenFile]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") {
        e.preventDefault(); e.stopPropagation();
        onClose();
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault(); e.stopPropagation();
        setActiveIdx(i => Math.min(results.length - 1, i + 1));
        return;
      }
      if (e.key === "ArrowUp") {
        e.preventDefault(); e.stopPropagation();
        setActiveIdx(i => Math.max(0, i - 1));
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault(); e.stopPropagation();
        commit(results[activeIdx]);
        return;
      }
    };
    window.addEventListener("keydown", onKey, true);
    return () => window.removeEventListener("keydown", onKey, true);
  }, [results, activeIdx, onClose, commit]);

  return ReactDOM.createPortal(
    <>
      <div className="modal-backdrop" onClick={onClose} />
      <div className="search-panel" role="dialog" aria-modal="true" aria-label="Search">
        <div className="search-head">
          <Icon name="search" size={16} stroke={2} />
          <input
            ref={inputRef}
            className="search-input"
            placeholder="Search files and folders…"
            value={query}
            onChange={e => setQuery(e.target.value)}
            spellCheck={false}
          />
          <span className="search-kbd">Esc</span>
        </div>
        <div className="search-results" ref={listRef}>
          {query.trim() === "" && (
            <div className="search-empty">
              Type to search {folders.length} folder{folders.length === 1 ? "" : "s"}.
            </div>
          )}
          {query.trim() !== "" && results.length === 0 && (
            <div className="search-empty">No matches for "{query}".</div>
          )}
          {results.map((r, i) => {
            const isActive = i === activeIdx;
            const isFolder = r.kind === "folder";
            let iconBg;
            if (isFolder) {
              const preset = PRESETS[r.data.defaultPalette] || PRESETS.parchment;
              iconBg = `linear-gradient(135deg, ${preset.front}, ${preset.back})`;
            } else {
              iconBg = kindGradient(r.data.type);
            }
            return (
              <div
                key={r.id}
                data-idx={i}
                className={"search-row" + (isActive ? " is-active" : "")}
                onMouseEnter={() => setActiveIdx(i)}
                onClick={() => commit(r)}
              >
                <span className="search-row-icon" style={{ background: iconBg }} aria-hidden="true" />
                <div className="search-row-meta">
                  <div className="search-row-name">{r.title}</div>
                  <div className="search-row-sub">{r.subtitle}</div>
                </div>
                <div className="search-row-kind">
                  {isFolder ? "Folder" : kindFromMime(r.data.type, r.data.name)}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </>,
    document.body
  );
}

  const [modal, setModal] = useState(null);
  const [folderMenu, setFolderMenu] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [folderDragId, setFolderDragId] = useState(null);
  const [folderDrop, setFolderDrop] = useState(null);
  const [clipboard, setClipboard] = useState(null);
  const [trashOpen, setTrashOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);

  const [dragFile, setDragFile] = useState(null);
  const [explorerHidden, setExplorerHidden] = useState(false);
  const [fileDropTarget, setFileDropTarget] = useState(null);

  const [selectedFolders, setSelectedFolders] = useState(() => new Set());
  const [activeFolderKey, setActiveFolderKey] = useState(null);
  const folderAnchorRef = useRef(null);
  const folderGridRef = useRef(null);
  const [folderBand, setFolderBand] = useState(null);
  const [folderBandStart, setFolderBandStart] = useState(null);

  const storage = useStorage();
  const {
    isElectron, loading, folders, files, trash, scan, urlFor,
    revealInSystem, openInCursor, readTextFile, moveFile, copyFile,
    restoreFromTrash, emptyTrash, openFolder, openRoot,
  } = storage;

  useEffect(() => { savePrefs(prefs); }, [prefs]);
  useEffect(() => {
    document.documentElement.classList.toggle("dark", prefs.theme === "dark");
    document.documentElement.dataset.accent = prefs.accent || "default";
  }, [prefs.theme, prefs.accent]);

  const updatePrefs = useCallback(patch => {
    setPrefs(prev => { const next = { ...prev, ...patch }; savePrefs(next); return next; });
  }, []);
  const resetPrefs = useCallback(() => { setPrefs(DEFAULT_PREFS); savePrefs(DEFAULT_PREFS); }, []);

  const toggleView = useCallback(() => {
    setPrefs(prev => {
      const next = { ...prev, view: prev.view === "list" ? "folders" : "list" };
      savePrefs(next);
      return next;
    });
  }, []);

  const showToast = useCallback((message) => {
    const id = `${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    setToasts(prev => [...prev, { id, message }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), CONFIG.toast.duration);
  }, []);

  useEffect(() => {
    setSelectedFolders(prev => {
      const ids = new Set(folders.map(f => f.id));
      const next = new Set([...prev].filter(id => ids.has(id)));
      if (next.size === prev.size) return prev;
      return next;
    });
    if (activeFolderKey && !folders.find(f => f.id === activeFolderKey)) {
      setActiveFolderKey(null);
    }
  }, [folders, activeFolderKey]);

  const handleCreateFolder = useCallback(async (rawTitle) => {
    const finalTitle = await storage.createFolder(rawTitle);
    showToast(`Folder "${finalTitle}" created`);
  }, [storage, showToast]);
  const handleRenameFolder = useCallback(async (folderId, rawTitle) => {
    await storage.renameFolder(folderId, rawTitle);
    showToast("Folder renamed");
  }, [storage, showToast]);
  const handleDeleteFolder = useCallback(async (folderId) => {
    const folder = folders.find(f => f.id === folderId);
    await storage.deleteFolder(folderId);
    if (explorerFolderId === folderId) setExplorerFolderId(null);
    showToast(folder ? `"${folder.title}" deleted` : "Folder deleted");
  }, [storage, folders, explorerFolderId, showToast]);

  const handleBulkDeleteFolders = useCallback(async () => {
    const ids = [...selectedFolders];
    if (ids.length === 0) return;
    for (const id of ids) {
      await storage.deleteFolder(id);
    }
    if (explorerFolderId && ids.includes(explorerFolderId)) setExplorerFolderId(null);
    setSelectedFolders(new Set());
    setActiveFolderKey(null);
    setModal(null);
    showToast(`Deleted ${ids.length} folder${ids.length === 1 ? "" : "s"}`);
  }, [selectedFolders, storage, explorerFolderId, showToast]);

  const anyOverlay = settingsOpen || !!explorerFolderId || !!lightbox || !!modal || trashOpen || searchOpen;
  useEffect(() => {
    if (!anyOverlay) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, [anyOverlay]);

  useEffect(() => {
    const onKey = e => {
      if (e.key !== "Escape") return;
      if (modal) { setModal(null); return; }
      if (trashOpen) { setTrashOpen(false); return; }
      if (folderMenu) { setFolderMenu(null); return; }
      if (lightbox) return;
      if (settingsOpen) { setSettingsOpen(false); return; }
      if (explorerFolderId) { setExplorerFolderId(null); return; }
      if (selectedFolders.size > 0 || activeFolderKey) {
        setSelectedFolders(new Set());
        setActiveFolderKey(null);
        return;
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [modal, trashOpen, folderMenu, lightbox, settingsOpen, explorerFolderId,
      selectedFolders, activeFolderKey]);

  useEffect(() => {
    const onKey = (e) => {
      const cmdOrCtrl = e.metaKey || e.ctrlKey;

      if (cmdOrCtrl && e.key.toLowerCase() === "n") {
        e.preventDefault();
        e.stopPropagation();
        setModal({ kind: "new" });
        return;
      }
      if (cmdOrCtrl && e.key.toLowerCase() === "q") {
        e.preventDefault();
        e.stopPropagation();
        setSearchOpen(o => !o);
        return;
      }
      if (cmdOrCtrl && e.key.toLowerCase() === "k") {
        e.preventDefault();
        e.stopPropagation();
        toggleView();
        return;
      }
      if (cmdOrCtrl && e.key.toLowerCase() === "r") {
        e.preventDefault();
        scan().then(() => showToast("Refreshed from disk"));
        return;
      }
      if (e.key === "F5") {
        e.preventDefault();
        scan().then(() => showToast("Refreshed from disk"));
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [scan, showToast, toggleView]);

  useEffect(() => {
    const noOverlay = !anyOverlay && folders.length > 0;
    if (!noOverlay) return;

    const ids = folders.map(f => f.id);

    const moveTo = (newKey, extend) => {
      if (extend) {
        if (!folderAnchorRef.current) folderAnchorRef.current = activeFolderKey;
        const anchor = folderAnchorRef.current || activeFolderKey || newKey;
        const a = ids.indexOf(anchor);
        const b = ids.indexOf(newKey);
        setActiveFolderKey(newKey);
        if (a === -1 || b === -1) {
          setSelectedFolders(new Set([newKey]));
        } else {
          const [s, e2] = a < b ? [a, b] : [b, a];
          setSelectedFolders(new Set(ids.slice(s, e2 + 1)));
        }
      } else {
        folderAnchorRef.current = null;
        setActiveFolderKey(newKey);
        setSelectedFolders(new Set([newKey]));
      }
    };

    const onKey = (e) => {
      const tag = (e.target?.tagName || "").toUpperCase();
      if (tag === "INPUT" || tag === "TEXTAREA") return;

      const meta = e.metaKey || e.ctrlKey;

      if (e.key === "ArrowLeft" || e.key === "ArrowRight" ||
          e.key === "ArrowUp" || e.key === "ArrowDown" ||
          e.key === "Home" || e.key === "End") {
        e.preventDefault();
        e.stopPropagation();
        const currentIdx = activeFolderKey ? ids.indexOf(activeFolderKey) : -1;
        let nextIdx;
        if (currentIdx === -1) {
          nextIdx = (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "End")
            ? ids.length - 1 : 0;
        } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
          nextIdx = Math.min(ids.length - 1, currentIdx + 1);
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          nextIdx = Math.max(0, currentIdx - 1);
        } else if (e.key === "Home") {
          nextIdx = 0;
        } else {
          nextIdx = ids.length - 1;
        }
        moveTo(ids[nextIdx], e.shiftKey);
        return;
      }

      if (meta && e.key.toLowerCase() === "a") {
        e.preventDefault();
        e.stopPropagation();
        setSelectedFolders(new Set(ids));
        if (!activeFolderKey) setActiveFolderKey(ids[0]);
        return;
      }

      if (e.key === "Delete" || e.key === "Backspace") {
        if (selectedFolders.size === 0) return;
        e.preventDefault();
        e.stopPropagation();
        setModal({ kind: "bulk-delete" });
        return;
      }

      if (e.key === "Enter") {
        if (!activeFolderKey) return;
        e.preventDefault();
        e.stopPropagation();
        setExplorerFolderId(activeFolderKey);
        return;
      }

      if (e.key === "F2") {
        if (!activeFolderKey) return;
        e.preventDefault();
        e.stopPropagation();
        setModal({ kind: "rename", folderId: activeFolderKey });
        return;
      }
    };

    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [anyOverlay, folders, activeFolderKey, selectedFolders]);

  const onFolderGridMouseDown = useCallback((e) => {
    if (e.button !== 0) return;
    if (e.target.closest(".folder")) return;
    if (e.target.closest(".empty-popper")) return;
    if (anyOverlay) return;

    setFolderBandStart({ x: e.clientX, y: e.clientY });
    if (!e.metaKey && !e.ctrlKey && !e.shiftKey) {
      setSelectedFolders(new Set());
      setActiveFolderKey(null);
    }
    folderAnchorRef.current = null;
  }, [anyOverlay]);

  useEffect(() => {
    if (!folderBandStart) return;
    let moved = false;
    const onMove = (ev) => {
      const dx = ev.clientX - folderBandStart.x;
      const dy = ev.clientY - folderBandStart.y;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      moved = true;
      setFolderBand({
        x1: Math.min(folderBandStart.x, ev.clientX),
        y1: Math.min(folderBandStart.y, ev.clientY),
        x2: Math.max(folderBandStart.x, ev.clientX),
        y2: Math.max(folderBandStart.y, ev.clientY),
      });
    };
    const onUp = (ev) => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      if (moved) {
        const rect = {
          x1: Math.min(folderBandStart.x, ev.clientX),
          y1: Math.min(folderBandStart.y, ev.clientY),
          x2: Math.max(folderBandStart.x, ev.clientX),
          y2: Math.max(folderBandStart.y, ev.clientY),
        };
        const grid = folderGridRef.current;
        if (grid) {
          const hits = new Set();
          grid.querySelectorAll("[data-folder-id]").forEach(el => {
            const r = el.getBoundingClientRect();
            if (r.right > rect.x1 && r.left < rect.x2 &&
                r.bottom > rect.y1 && r.top < rect.y2) {
              hits.add(el.dataset.folderId);
            }
          });
          if (ev.shiftKey || ev.metaKey || ev.ctrlKey) {
            setSelectedFolders(prev => new Set([...prev, ...hits]));
          } else {
            setSelectedFolders(hits);
          }
          const arr = [...hits];
          if (arr.length > 0) setActiveFolderKey(arr[arr.length - 1]);
        }
      }
      setFolderBandStart(null);
      setFolderBand(null);
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    return () => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    };
  }, [folderBandStart]);

  const onFolderCardClick = useCallback((e, folder) => {
    if (e.metaKey || e.ctrlKey) {
      setSelectedFolders(prev => {
        const next = new Set(prev);
        if (next.has(folder.id)) next.delete(folder.id);
        else next.add(folder.id);
        return next;
      });
      setActiveFolderKey(folder.id);
      folderAnchorRef.current = null;
    } else if (e.shiftKey && activeFolderKey) {
      const ids = folders.map(f => f.id);
      const anchor = folderAnchorRef.current || activeFolderKey;
      const a = ids.indexOf(anchor);
      const b = ids.indexOf(folder.id);
      if (a !== -1 && b !== -1) {
        const [s, e2] = a < b ? [a, b] : [b, a];
        setSelectedFolders(new Set(ids.slice(s, e2 + 1)));
      } else {
        setSelectedFolders(new Set([folder.id]));
      }
      setActiveFolderKey(folder.id);
    } else {
      setSelectedFolders(new Set([folder.id]));
      setActiveFolderKey(folder.id);
      folderAnchorRef.current = null;
    }
  }, [folders, activeFolderKey]);

  const onFolderCardDoubleClick = useCallback((folder) => {
    setExplorerFolderId(folder.id);
  }, []);

  const openLightbox = useCallback(payload => setLightbox({ ...payload, closing: false }), []);
  const closeLightbox = useCallback(() => {
    setLightbox(prev => prev ? { ...prev, closing: true } : null);
    setTimeout(() => setLightbox(null), CONFIG.durations.flipClose);
  }, []);
  const navigateLightbox = useCallback(i => {
    setLightbox(prev => prev ? { ...prev, index: i, sourceRect: null } : null);
  }, []);

  const openUpload = useCallback(async (record) => {
    if (record.type.startsWith("image/")) {
      const url = urlFor(record);
      openLightbox({
        folderId: record.folderId,
        projects: [{
          id: record.id,
          title: record.name,
          image: url,
          gradient: kindGradient(record.type),
          desc: `${kindFromMime(record.type, record.name)} · ${formatSize(record.size)}`,
          tech: `Modified ${formatDate(record.lastModified)}`,
          href: "#",
        }],
        index: 0,
        sourceRect: null,
      });
    } else {
      try { await storage.openFile(record); }
      catch (e) { showToast("Could not open file"); }
    }
  }, [urlFor, openLightbox, storage, showToast]);

  const download = useCallback(async (record) => {
    if (isElectron) {
      try { await storage.openFile(record); }
      catch (e) { showToast("Could not open file"); }
      return;
    }
    const url = urlFor(record);
    if (!url) return;
    const a = document.createElement("a");
    a.href = url;
    a.download = record.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }, [isElectron, storage, urlFor, showToast]);

  const openExplorer = useCallback((folderId) => {
    const folder = folders.find(f => f.id === folderId);
    if (!folder) return;
    setExplorerFolderId(folderId);
  }, [folders]);

  const handleCopy = useCallback((record) => {
    setClipboard({ mode: "copy", folder: record.folderId || record.folder, name: record.name, type: record.type });
  }, []);
  const handleCut = useCallback((record) => {
    setClipboard({ mode: "cut", folder: record.folderId || record.folder, name: record.name, type: record.type });
  }, []);
  const clearClipboard = useCallback(() => setClipboard(null), []);

  const executeMove = useCallback(async (record, toFolder) => {
    const rec = record.folder ? { folderId: record.folder, name: record.name } : record;
    await moveFile(rec, toFolder);
    showToast(`Moved to ${toFolder}`);
  }, [moveFile, showToast]);

  const executeCopy = useCallback(async (record, toFolder) => {
    const rec = record.folder ? { folderId: record.folder, name: record.name } : record;
    await copyFile(rec, toFolder);
    showToast(`Copied to ${toFolder}`);
  }, [copyFile, showToast]);

  const requestMove = useCallback((record, toFolder, openPicker) => {
    if (openPicker) return;
    executeMove(record, toFolder).catch(() => showToast("Move failed"));
  }, [executeMove, showToast]);

  const requestCopy = useCallback((record, toFolder, openPicker) => {
    if (openPicker) return;
    executeCopy(record, toFolder).catch(() => showToast("Copy failed"));
  }, [executeCopy, showToast]);

  const onFolderContextMenu = useCallback((e, folder) => {
    e.preventDefault();
    e.stopPropagation();

    const isMulti = selectedFolders.has(folder.id) && selectedFolders.size > 1;

    if (isMulti) {
      setFolderMenu({
        x: e.clientX, y: e.clientY,
        items: [
          { heading: "Selection" },
          { label: `Delete ${selectedFolders.size} folders`, icon: "trash", danger: true,
            onClick: () => setModal({ kind: "bulk-delete" }) },
          { separator: true },
          { label: "Deselect all", icon: "x",
            onClick: () => { setSelectedFolders(new Set()); setActiveFolderKey(null); } },
        ],
      });
      return;
    }

    if (!selectedFolders.has(folder.id)) {
      setSelectedFolders(new Set([folder.id]));
      setActiveFolderKey(folder.id);
    }

    const items = [
      { heading: "Actions" },
      { label: "Open", icon: "external", shortcut: "↵",
        onClick: () => openExplorer(folder.id) },
    ];
    if (isElectron) {
      items.push({
        label: OPEN_FOLDER_LABEL, icon: "folder",
        onClick: () => openFolder(folder.id).catch(() => showToast("Could not open folder")),
      });
    }
    items.push(
      { separator: true },
      { label: "Rename…", icon: "pencil", shortcut: "F2",
        onClick: () => setModal({ kind: "rename", folderId: folder.id }) },
      { separator: true },
      { label: "Delete", icon: "trash", danger: true, shortcut: "⌫",
        onClick: () => setModal({ kind: "delete", folderId: folder.id }) },
    );

    setFolderMenu({ x: e.clientX, y: e.clientY, items });
  }, [selectedFolders, openExplorer, isElectron, openFolder, showToast]);

  const onFolderDragStart = useCallback((e, folder) => {
    setFolderDragId(folder.id);
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", folder.id); } catch {}
  }, []);

  const onFolderDragOver = useCallback((e, folder) => {
    const types = Array.from(e.dataTransfer?.types || []);
    const hasFiles = types.includes("Files");

    if (folderDragId) {
      if (folderDragId === folder.id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) < rect.width / 2 ? "before" : "after";
      setFolderDrop({ id: folder.id, position: pos });
      return;
    }

    if (hasFiles || dragFile) {
      e.preventDefault();
      e.dataTransfer.dropEffect = dragFile ? "move" : "copy";
      if (fileDropTarget !== folder.id) setFileDropTarget(folder.id);
    }
  }, [folderDragId, dragFile, fileDropTarget]);

  const onFolderDragLeave = useCallback((e, folder) => {
    const to = e.relatedTarget;
    if (to && e.currentTarget.contains(to)) return;
    if (fileDropTarget === folder.id) setFileDropTarget(null);
    if (folderDrop?.id === folder.id) setFolderDrop(null);
  }, [fileDropTarget, folderDrop]);

  const onFolderDrop = useCallback(async (e, folder) => {
    e.preventDefault();
    e.stopPropagation();

    const fileToMove = dragFile;
    const externalFiles = e.dataTransfer?.files;
    const hasExternal = externalFiles && externalFiles.length > 0;
    const reorder = folderDragId && folderDragId !== folder.id && folderDrop;

    setFileDropTarget(null);
    setFolderDrop(null);

    if (fileToMove) {
      try {
        await moveFile(fileToMove.record, folder.id);
        showToast(`Moved to ${folder.title}`);
      } catch (err) {
        showToast("Move failed");
      }
      setDragFile(null);
      setExplorerHidden(false);
      setExplorerFolderId(null);
      return;
    }

    if (hasExternal) {
      try {
        await storage.addFiles(folder.id, externalFiles);
        showToast(`Added ${externalFiles.length} file${externalFiles.length === 1 ? "" : "s"} to ${folder.title}`);
      } catch (err) {
        showToast("Upload failed");
      }
      return;
    }

    if (reorder) {
      storage.reorderFolders(folderDragId, folderDrop.id, folderDrop.position);
      setFolderDragId(null);
    }
  }, [dragFile, folderDragId, folderDrop, moveFile, storage, showToast]);

  const onFolderDragEnd = useCallback(() => {
    setFolderDragId(null);
    setFolderDrop(null);
    setDragFile(null);
    setExplorerHidden(false);
    setFileDropTarget(null);
  }, []);

  const onFileDragBegin = useCallback((record, sourceFolder) => {
    setDragFile({ record, sourceFolder });
  }, []);
  const onFileDragEnd = useCallback(() => {
    setDragFile(null);
    setExplorerHidden(false);
    setFileDropTarget(null);
  }, []);
  const onFileDragOutside = useCallback((outside) => {
  // Once hidden during a drag, stay hidden until the drag ends.
  // Otherwise the cursor passing back over the Fluidview's (still-present)
  // bounding box flips it back on and it covers the folder card you're
  // trying to drop onto.
  if (outside) setExplorerHidden(true);
}, []);

  useEffect(() => {
    const onDragEnd = () => {
      setFileDropTarget(null);
      setFolderDrop(null);
      setFolderDragId(null);
      setDragFile(null);
      setExplorerHidden(false);
    };
    document.addEventListener("dragend", onDragEnd);
    return () => document.removeEventListener("dragend", onDragEnd);
  }, []);

  const customised = useMemo(() => isCustomised(prefs, folders), [prefs, folders]);
  const hiddenCardId = lightbox && !lightbox.closing
    ? lightbox.projects[lightbox.index]?.id
    : null;
  const explorerFolder = explorerFolderId
    ? folders.find(f => f.id === explorerFolderId)
    : null;
  const modalFolder = modal?.folderId
    ? folders.find(f => f.id === modal.folderId)
    : null;
  const bulkFolders = useMemo(() => {
    if (modal?.kind !== "bulk-delete") return [];
    return folders.filter(f => selectedFolders.has(f.id));
  }, [modal, folders, selectedFolders]);

  if (loading) {
    return (
      <main className="page">
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "center",
          minHeight: "60vh", color: "var(--muted)", fontSize: 13, letterSpacing: ".4px",
        }}>
          {isElectron ? "Opening ~/Myne/…" : "Loading…"}
        </div>
      </main>
    );
  }

  const isListView = prefs.view === "list";

  return (
    <>
      <main className="page">
        <header className="topbar">
          <div className="brand">
            <span className="brand-main">ALEX CHEN</span>
            <span className="brand-rule" />
            <span className="brand-sub">{isElectron ? "MYNE · LOCAL" : "MYNE"}</span>
          </div>
          <div className="topbar-right">
            <nav className="nav" aria-label="Primary">
              <a href="#">Home</a>
              <a className="active" href="#projects">Projects</a>
              <a href="#">About</a>
              <a href="#">Contact</a>
            </nav>
            <div className="controls">
              <IconButton icon="plus" label="New folder (Ctrl+N)"
                          onClick={() => setModal({ kind: "new" })} />
              <IconButton icon={prefs.theme === "light" ? "moon" : "sun"}
                          label={prefs.theme === "light" ? "Switch to dark mode" : "Switch to light mode"}
                          onClick={() => updatePrefs({ theme: prefs.theme === "light" ? "dark" : "light" })} />
              <IconButton icon="gear" label="Settings" dot={customised}
                          onClick={() => setSettingsOpen(true)} />
            </div>
          </div>
        </header>

        <section className="hero" id="projects">
          <h1>PROJECTS</h1>
          <p>
            {isElectron
              ? "Everything lives in ~/Myne/ on your disk. Drop files on a folder to add them. Drag to reorder. Ctrl+N for a new folder. ⌘ toggles list view."
              : "A curated collection of my work in product design, development and research."}
          </p>
        </section>

        <div ref={folderGridRef}
             className={folderBand ? "is-band-active" : ""}
             onMouseDown={isListView ? undefined : onFolderGridMouseDown}
             style={isListView ? undefined : { borderRadius: 20, transition: "background .2s ease" }}>
          {isListView ? (
            <FolderListView
              folders={folders}
              files={files}
              prefs={prefs}
              onFolderClick={onFolderCardClick}
              onFolderDoubleClick={onFolderCardDoubleClick}
              onContextMenu={onFolderContextMenu}
              selectedFolders={selectedFolders}
              activeFolderKey={activeFolderKey}
              folderDragId={folderDragId}
              folderDrop={folderDrop}
              onFolderDragStart={onFolderDragStart}
              onFolderDragOver={onFolderDragOver}
              onFolderDragLeave={onFolderDragLeave}
              onFolderDrop={onFolderDrop}
              onFolderDragEnd={onFolderDragEnd}
            />
          ) : (
            <section key="folders"
                     className={"folders view-enter" + (folderBand ? " is-band-active" : "")}
                     aria-label="Project folders">
              {folders.length === 0 && (
                <div className="explorer-empty" style={{ width: "100%" }}>
                  No folders yet. Click <strong>+</strong> or press <strong>Ctrl+N</strong> to create one.
                </div>
              )}
              {folders.map(folder => {
                const dropClass = folderDrop?.id === folder.id && folderDragId !== folder.id
                  ? ` drop-${folderDrop.position}` : "";
                return (
                  <AnimatedFolder key={folder.id}
                                  folder={folder}
                                  files={files[folder.id] || []}
                                  urlFor={urlFor}
                                  onOpenUpload={openUpload}
                                  paletteKey={prefs.folderPalettes?.[folder.id] || folder.defaultPalette}
                                  hiddenCardId={lightbox && lightbox.folderId === folder.id ? hiddenCardId : null}
                                  onOpenLightbox={openLightbox}
                                  onOpenExplorer={openExplorer}
                                  onContextMenu={onFolderContextMenu}
                                  isDragging={folderDragId === folder.id}
                                  dropClass={dropClass}
                                  isFileDropTarget={fileDropTarget === folder.id}
                                  isSelected={selectedFolders.size > 1 && selectedFolders.has(folder.id)}
                                  isActive={false}
                                  onClick={e => onFolderCardClick(e, folder)}
                                  onDoubleClick={() => onFolderCardDoubleClick(folder)}
                                  onFolderDragStart={onFolderDragStart}
                                  onFolderDragOver={onFolderDragOver}
                                  onFolderDragLeave={onFolderDragLeave}
                                  onFolderDrop={onFolderDrop}
                                  onFolderDragEnd={onFolderDragEnd} />
                );
              })}
            </section>
          )}
        </div>
      </main>

      {explorerFolder && (
        <Explorer
          key={explorerFolder.id}
          folder={explorerFolder}
          files={files[explorerFolder.id] || []}
          urlFor={urlFor}
          isElectron={isElectron}
          windowStyle={prefs.windowStyle || "default"}
          expanded={!!prefs.explorerExpanded}
          onToggleExpand={() => updatePrefs({ explorerExpanded: !prefs.explorerExpanded })}
          onClose={() => setExplorerFolderId(null)}
          onAddFiles={storage.addFiles}
          onRemove={storage.removeFile}
          onRename={storage.renameFile}
          onDownload={download}
          onOpenUpload={openUpload}
          onReorderFiles={storage.reorderFiles}
          onOpenBuiltin={(project, index) => openLightbox({
            folderId: explorerFolder.id,
            projects: explorerFolder.projects,
            index,
            sourceRect: null,
          })}
          folders={folders}
          onMoveTo={requestMove}
          onCopyTo={requestCopy}
          onOpenInCursor={openInCursor}
          onRevealInSystem={revealInSystem}
          readTextFile={readTextFile}
          clipboard={clipboard}
          onCopy={handleCopy}
          onCut={handleCut}
          onClearClipboard={clearClipboard}
          hidden={explorerHidden}
          onFileDragBegin={onFileDragBegin}
          onFileDragEnd={onFileDragEnd}
          onFileDragOutside={onFileDragOutside}
        />
      )}

      {lightbox && (
        <Lightbox
          projects={lightbox.projects}
          index={lightbox.index}
          sourceRect={lightbox.sourceRect}
          closing={lightbox.closing}
          onRequestClose={closeLightbox}
          onNavigate={navigateLightbox}
        />
      )}
      {searchOpen && (
        <GlobalSearch
          folders={folders}
          files={files}
          onClose={() => setSearchOpen(false)}
          onOpenFolder={(id) => setExplorerFolderId(id)}
          onOpenFile={openUpload}
        />
      )}
      {trashOpen && (
        <TrashPanel
          trash={trash}
          onClose={() => setTrashOpen(false)}
          onRestore={async (id) => { await restoreFromTrash(id); showToast("Restored"); }}
          onEmpty={async () => {
            await emptyTrash();
            showToast("Trash emptied");
            setTrashOpen(false);
          }}
        />
      )}

      {folderMenu && (
        <ContextMenu x={folderMenu.x} y={folderMenu.y}
                     items={folderMenu.items}
                     onClose={() => setFolderMenu(null)} />
      )}

      {modal?.kind === "new" && (
        <NewFolderModal onCancel={() => setModal(null)}
                        onConfirm={async (title) => { setModal(null); await handleCreateFolder(title); }} />
      )}
      {modal?.kind === "rename" && modalFolder && (
        <RenameFolderModal folder={modalFolder} onCancel={() => setModal(null)}
                           onConfirm={async (title) => { setModal(null); await handleRenameFolder(modalFolder.id, title); }} />
      )}
      {modal?.kind === "delete" && modalFolder && (
        <DeleteFolderModal folder={modalFolder}
                           uploadCount={(files[modalFolder.id] || []).length}
                           onCancel={() => setModal(null)}
                           onConfirm={async () => { setModal(null); await handleDeleteFolder(modalFolder.id); }} />
      )}
      {modal?.kind === "bulk-delete" && bulkFolders.length > 0 && (
        <BulkDeleteFoldersModal
          folders={bulkFolders}
          files={files}
          onCancel={() => setModal(null)}
          onConfirm={handleBulkDeleteFolders} />
      )}

      {!anyOverlay && (
        <button type="button"
                className={"cmd-fab" + (isListView ? " is-list-mode" : "")}
                onClick={toggleView}
                aria-label={isListView ? "Switch to folder view (Ctrl+K)" : "Switch to list view (Ctrl+K)"}
                title={isListView ? "Switch to folder view (Ctrl+K)" : "Switch to list view (Ctrl+K)"}>
          ⌘
        </button>
      )}

      {clipboard && !explorerFolderId && (
        <div className="clipboard-pill">
          <span className="clipboard-pill-icon">
            <Icon name={clipboard.mode === "cut" ? "scissors" : "copy"} size={13} stroke={2.2} />
          </span>
          <span>
            <strong>{clipboard.mode === "cut" ? "Cut" : "Copied"}</strong> · {clipboard.name}
          </span>
          <button onClick={clearClipboard}>Clear</button>
        </div>
      )}

      {selectedFolders.size > 1 && !explorerFolderId && !clipboard && (
        <div className="sel-bar">
          <span><strong>{selectedFolders.size}</strong> folders selected</span>
          <button className="is-danger"
                  onClick={() => setModal({ kind: "bulk-delete" })}>
            Delete
          </button>
          <button onClick={() => { setSelectedFolders(new Set()); setActiveFolderKey(null); }}>
            Clear
          </button>
        </div>
      )}

      {folderBand && ReactDOM.createPortal(
        <div className="drag-rect" style={{
          left: folderBand.x1,
          top: folderBand.y1,
          width: folderBand.x2 - folderBand.x1,
          height: folderBand.y2 - folderBand.y1,
        }} />,
        document.body
      )}
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)}
                     prefs={prefs} updatePrefs={updatePrefs} resetPrefs={resetPrefs}
                     folders={folders}
                     trashCount={trash.length}
                     isElectron={isElectron}
                     onRevealRoot={() => openRoot().catch(() => showToast("Could not open folder"))}
                     onOpenTrash={() => { setSettingsOpen(false); setTrashOpen(true); }} />

      <ToastViewport toasts={toasts} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
